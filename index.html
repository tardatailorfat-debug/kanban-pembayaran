<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Transaksi Pembayaran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Light Mode (default) ── */
  --bg:#F7F5F1;--bg2:#FFFFFF;--bg3:#F1EEE7;--bg4:#E7E3DB;
  --txt:#1C2333;--txt2:#6B7280;--txt3:#9CA3AF;
  --bdr:#E7E3DB;--bdr2:#D8D3C8;
  --navy:#182130;--navy2:#1e2b3d;--navy3:#243247;
  --blue:#2F6FED;--blue-bg:#E9EFFE;--blue-fg:#2547A0;
  --green:#16A34A;--green-bg:#DCFCE7;
  --orange:#B45309;--orange-bg:#FBF0DC;--orange-fg:#8A6116;
  --red:#B42318;--red-bg:#FEE2E2;
  --purple:#7C3AED;--purple-bg:#EDE9FE;
  --teal:#0D9488;--teal-bg:#CCFBF1;
  --gold:#C9A15A;--gold-bg:#FBF0DC;--gold-fg:#8A6116;
  --accent:#2F6FED;
  --radius:10px;--radius-lg:14px;
  --shadow:0 2px 8px rgba(24,33,48,.08),0 1px 2px rgba(24,33,48,.06);
  --shadow-lg:0 20px 60px rgba(0,0,0,.18);
  --font:'Manrope',sans-serif;--mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#0f1923;--bg2:#182130;--bg3:#1e2b3d;--bg4:#243247;
  --txt:#E8EDF5;--txt2:#8B98B0;--txt3:#4A5568;
  --bdr:#243247;--bdr2:#2d3f55;
  --navy:#0a1118;--navy2:#0f1923;--navy3:#182130;
  --blue:#4B8FFF;--blue-bg:#1a2d4e;--blue-fg:#7EB3FF;
  --green:#34D399;--green-bg:#064e3b;
  --orange:#FBBF24;--orange-bg:#3d2f0b;--orange-fg:#FDE68A;
  --red:#F87171;--red-bg:#450a0a;
  --purple:#A78BFA;--purple-bg:#2e1065;
  --teal:#5EEAD4;--teal-bg:#042f2e;
  --gold:#C9A15A;--gold-bg:#2d1f0b;--gold-fg:#FBBF24;
  --accent:#4B8FFF;
  --shadow:0 2px 8px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 20px 60px rgba(0,0,0,.6);
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100dvh;font-size:13px;overflow:hidden;transition:background .2s,color .2s}

/* LOGIN — new TARDA design */
#login-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 15% 15%,#2A3A56 0%,#182130 45%,#0E141D 100%);
  z-index:1000;overflow:hidden;
}
#login-screen::before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;border:1px solid rgba(255,255,255,.06);top:-160px;left:-140px;pointer-events:none}
#login-screen::after{content:'';position:absolute;width:360px;height:360px;border-radius:50%;border:1px solid rgba(255,255,255,.08);bottom:-120px;right:-80px;pointer-events:none}
.login-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.login-logo-img{width:150px;height:auto;margin-bottom:28px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.3))}
.login-card{background:#fff;border-radius:20px;padding:40px 36px;width:400px;max-width:90vw;box-shadow:0 40px 90px rgba(0,0,0,.4)}
.login-card h1{margin:0 0 4px;font-size:20px;font-weight:800;color:#111827;letter-spacing:-.01em}
.login-card p{margin:0 0 28px;font-size:14px;color:#6B7280;font-weight:500}
.login-label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:6px}
.login-field{margin-bottom:16px}
.login-select,.login-input{
  width:100%;height:44px;padding:0 14px;border-radius:10px;border:1.5px solid #E5E7EB;
  background:#fff;font-family:var(--font);font-size:14px;color:#111827;
  outline:none;transition:border-color .15s;box-sizing:border-box;
}
.login-select:focus,.login-input:focus{border-color:#2F6FED}
.login-btn{
  width:100%;height:46px;border-radius:10px;border:none;
  background:linear-gradient(135deg,#2F6FED,#182130);
  color:#fff;font-family:var(--font);font-size:14px;font-weight:800;
  cursor:pointer;margin-top:12px;transition:opacity .15s,transform .1s;
}
.login-btn:hover{opacity:.9}.login-btn:active{transform:scale(.98)}
.login-err{font-size:12px;color:#B42318;font-weight:600;margin-top:8px;text-align:center;min-height:18px}

/* APP LAYOUT */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.topbar{
  background:var(--navy);border-bottom:1px solid rgba(255,255,255,.08);
  padding:0 20px;display:flex;align-items:center;gap:12px;height:56px;flex-shrink:0;
}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-logo img{height:28px;width:auto}
.topbar h1{font-size:14px;font-weight:800;color:#fff;letter-spacing:-.3px}
.role-badge{
  font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);
  text-transform:uppercase;letter-spacing:.6px;
}
#topbar-name{color:rgba(255,255,255,.55);font-size:12px}
.topbar-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.topbar-divider{width:1px;height:22px;background:rgba(255,255,255,.15);margin:0 2px}
.user-avatar{
  width:32px;height:32px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#fff;flex-shrink:0;
}
.tb-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;color:rgba(255,255,255,.8);font-size:12px;padding:5px 11px;
  cursor:pointer;display:flex;align-items:center;gap:5px;
  font-family:var(--font);font-weight:600;transition:background .15s,border-color .15s;
}
.tb-btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
/* Override tb-btn inside content area (not topbar) */
.search-bar .tb-btn, .menu-tabs .tb-btn, .modal .tb-btn, .modal-body .tb-btn, .action-area .tb-btn{
  background:var(--bg3);border:1.5px solid var(--bdr);color:var(--txt2);
}
.search-bar .tb-btn:hover, .menu-tabs .tb-btn:hover, .modal .tb-btn:hover{border-color:var(--bdr2);color:var(--txt);background:var(--bg4)}
/* Dark mode toggle btn */
#btn-theme{font-size:15px;padding:5px 9px}


/* TOPBAR NAV LINKS */
#topbar-nav{display:flex}
.topbar-nav-btn{
  background:none;border:none;color:rgba(255,255,255,.6);font-family:var(--font);
  font-size:14px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;
  transition:background .15s,color .15s;
}
.topbar-nav-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.topbar-nav-btn.active{background:rgba(255,255,255,.14);color:#fff;font-weight:700}

/* MENU TABS (sub-tab Kasbon, masih horizontal di dalam konten) */
.menu-tabs{background:var(--bg2);border-bottom:1.5px solid var(--bdr);display:flex;gap:2px;padding:0 16px;flex-shrink:0;overflow-x:auto;align-items:center}
.menu-tabs::-webkit-scrollbar{height:0}
.menu-tab{background:none;border:none;border-bottom:2.5px solid transparent;color:var(--txt2);font-family:var(--font);font-size:13px;font-weight:600;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:color .15s,border-color .15s}
.menu-tab:hover{color:var(--txt)}
.menu-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}

/* SIDEBAR (Pembayaran / Kasbon) — slide dari kiri, navy themed */
.sidebar{
  position:fixed;top:52px;left:0;bottom:0;width:240px;background:var(--navy);
  border-right:1px solid rgba(255,255,255,.08);z-index:60;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .25s ease;padding:16px 12px;
}
.sidebar.open{transform:translateX(0)}
.sidebar-menu-label{font-size:11px;font-weight:800;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em;padding:2px 10px 10px}
.sidebar-hdr{display:none}
.sidebar-item{
  background:none;border:none;border-radius:10px;
  color:rgba(255,255,255,.55);font-family:var(--font);
  font-size:14px;font-weight:700;padding:10px 10px;cursor:pointer;display:flex;
  align-items:center;gap:10px;text-align:left;width:100%;transition:background .15s,color .15s;
}
.sidebar-item i{
  width:26px;height:26px;flex-shrink:0;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);
  transition:background .15s;
}
.sidebar-item:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85)}
.sidebar-item:hover i{background:rgba(255,255,255,.14)}
.sidebar-item.active{background:var(--blue);color:#fff}
.sidebar-item.active i{background:rgba(255,255,255,.2)}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;backdrop-filter:blur(2px)}
.sidebar-backdrop.open{display:block}

.stats-bar{
  background:var(--bg2);border-bottom:1.5px solid var(--bdr);
  padding:0 20px;display:flex;gap:20px;align-items:center;height:38px;
  flex-shrink:0;overflow-x:auto;
}
.stats-bar::-webkit-scrollbar{height:0}
.stat-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt2);white-space:nowrap;font-weight:600}
.stat-chip .dot{width:7px;height:7px;border-radius:50%}
.stat-chip strong{color:var(--txt);font-weight:700}

/* SEARCH BAR */
.search-bar{
  background:var(--bg2);border-bottom:1.5px solid var(--bdr);
  padding:10px 20px;display:flex;gap:10px;align-items:center;flex-shrink:0;flex-wrap:wrap;
}
.search-input-wrap{
  flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
  background:var(--bg);border:1.5px solid var(--bdr);border-radius:10px;padding:7px 12px;
  transition:border-color .15s,box-shadow .15s;
}
.search-input-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,237,.1)}
.search-input-wrap input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-family:var(--font);font-size:13px;font-weight:500}
.search-input-wrap input::placeholder{color:var(--txt3)}
#search-clear{background:none;border:none;color:var(--txt3);cursor:pointer;padding:0;display:flex}
#search-clear:hover{color:var(--txt)}
.search-select{
  background:var(--bg2);border:1.5px solid var(--bdr);border-radius:9px;
  color:var(--txt2);font-family:var(--font);font-size:13px;font-weight:600;
  padding:7px 10px;outline:none;flex-shrink:0;transition:border-color .15s;
}
.search-select:focus{border-color:var(--blue)}

/* BOARD */
.board-wrap{display:flex;flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding:20px 24px;gap:18px}
.board-wrap::-webkit-scrollbar{height:6px}
.board-wrap::-webkit-scrollbar-track{background:var(--bg)}
.board-wrap::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
.col{flex:0 0 290px;display:flex;flex-direction:column;background:var(--bg3);border-radius:16px;overflow:hidden;min-height:0;border:2px solid transparent;transition:border-color .15s,background .15s}
.col-hdr{padding:14px 14px 6px;display:flex;align-items:center;gap:8px}
.col-hdr .ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.col-hdr .label{font-size:12px;font-weight:800;flex:1;color:var(--txt);text-transform:uppercase;letter-spacing:.03em}
.col-hdr .cnt{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bg2);color:var(--txt2)}
.col-total{padding:2px 14px 10px;font-size:12px;color:var(--txt3);font-weight:600}
.cards{flex:1;overflow-y:auto;padding:6px 8px 8px;display:flex;flex-direction:column;gap:10px}
.cards::-webkit-scrollbar{width:3px}
.cards::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
/* CARD — new design */
.card{
  background:var(--bg2);border-radius:12px;padding:14px;cursor:pointer;
  border:1.5px solid var(--bdr);
  box-shadow:0 1px 2px rgba(15,23,42,.06);
  transition:transform .15s,box-shadow .15s,border-color .15s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(24,33,48,.12);border-color:var(--bdr2)}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-priority{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;display:flex;align-items:center;gap:5px}
.card-priority-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.card-id{font-size:11px;color:var(--txt3);font-family:var(--mono);font-weight:600}
.card-name{font-weight:700;font-size:13.5px;color:var(--txt);margin-bottom:6px;line-height:1.35}
.card-amount{font-weight:800;font-size:17px;color:var(--navy);margin-bottom:12px;font-family:var(--mono)}
[data-theme="dark"] .card-amount{color:var(--txt)}
.card-bottom{display:flex;align-items:center;justify-content:space-between}
.card-dept-badge{background:var(--bg3);color:var(--orange-fg);font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px}
[data-theme="dark"] .card-dept-badge{background:var(--bg4);color:var(--orange)}
.card-approver{display:flex;align-items:center;gap:6px}
.card-approver-avatar{width:22px;height:22px;border-radius:50%;background:var(--blue-bg);font-family:var(--font);color:var(--blue-fg);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-approver-name{font-size:11px;color:var(--txt2);font-weight:600}
.card-rev-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--red-bg);color:var(--red);font-weight:700}
.card-vendor{font-size:11px;color:var(--txt2);margin-bottom:4px;display:flex;align-items:center;gap:4px;font-weight:500}
.add-btn{
  margin:8px;padding:9px;border:1.5px dashed var(--bdr2);border-radius:10px;
  background:none;color:var(--txt3);font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
  flex-shrink:0;font-family:var(--font);font-weight:600;
  transition:background .15s,color .15s,border-color .15s;
}
.add-btn:hover{background:var(--bg2);color:var(--blue);border-color:var(--blue)}

/* OVERLAY/MODAL */
.overlay{position:fixed;inset:0;background:rgba(15,25,40,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{
  background:var(--bg2);border:1.5px solid var(--bdr);border-radius:var(--radius-lg);
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);
}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
.modal-hdr{
  padding:18px 20px 14px;border-bottom:1.5px solid var(--bdr);
  display:flex;align-items:flex-start;gap:12px;position:sticky;top:0;
  background:var(--bg2);z-index:2;
}
.m-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-hdr h2{font-size:15px;font-weight:800;color:var(--txt);letter-spacing:-.01em}
.modal-hdr p{font-size:12px;color:var(--txt2);margin-top:2px;font-weight:500}
.modal-close{margin-left:auto;background:none;border:none;color:var(--txt3);cursor:pointer;padding:4px;font-size:18px;transition:color .15s;border-radius:6px}
.modal-close:hover{color:var(--txt);background:var(--bg3)}
.modal-body{padding:18px 20px}
.section{margin-bottom:18px}
.section label,.slbl{display:block;font-size:11px;color:var(--txt3);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{
  font-size:13.5px;color:var(--txt);padding:9px 12px;
  background:var(--bg);border-radius:var(--radius);
  border:1.5px solid var(--bdr);font-family:var(--font);
}
input.fld,select.fld,textarea.fld{width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input.fld:focus,select.fld:focus,textarea.fld:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
textarea.fld{resize:vertical;min-height:64px}
select.fld option{background:var(--bg2)}
.info-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13px}
.info-grid .k{color:var(--txt2);font-weight:600}
.info-grid .v{color:var(--txt);font-weight:600;font-family:var(--mono);font-size:12px}
.info-grid .v.plain{font-family:var(--font);font-size:13px}
.divider{height:1.5px;background:var(--bdr);margin:14px 0}
.tax-box{background:var(--bg3);border-radius:var(--radius);padding:14px;border:1.5px solid var(--bdr)}
.tax-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--txt);font-weight:500}
.tax-row.total{font-weight:800;border-top:1.5px solid var(--bdr);margin-top:6px;padding-top:8px;color:var(--green)}
.hist-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bdr)}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.hist-text{font-size:12.5px;color:var(--txt);font-weight:500}
.hist-time{font-size:11px;color:var(--txt3);font-family:var(--mono);font-weight:500}
.action-area{padding:14px 20px 18px;border-top:1.5px solid var(--bdr);display:flex;flex-direction:column;gap:10px}

/* BUTTONS */
.btn{
  padding:10px 18px;border-radius:var(--radius);font-size:13.5px;font-weight:700;
  cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;
  gap:7px;transition:opacity .15s,transform .1s,box-shadow .15s;font-family:var(--font);
}
.btn:hover{opacity:.88;box-shadow:0 4px 12px rgba(0,0,0,.15)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-warn{background:var(--orange);color:#fff}
.btn-ghost{background:var(--bg3);color:var(--txt);border:1.5px solid var(--bdr)}
.btn-ghost:hover{border-color:var(--bdr2)}
.btn-teal{background:var(--teal);color:#fff}
.btn-purple{background:var(--purple);color:#fff}

/* FILE UPLOAD */
.upload-zone{border:2px dashed var(--bdr2);border-radius:var(--radius);padding:18px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--bg3)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--blue);background:rgba(47,111,237,.05)}
.upload-zone input{display:none}
.upload-zone .uz-ico{font-size:22px;color:var(--txt3);margin-bottom:6px}
.upload-zone p{font-size:12px;color:var(--txt2)}
.upload-zone small{font-size:10.5px;color:var(--txt3)}
.file-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.file-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1.5px solid var(--bdr);border-radius:var(--radius);padding:8px 12px;transition:border-color .15s}
.file-item:hover{border-color:var(--bdr2)}
.file-item .fi-name{flex:1;font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .fi-cat{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--blue-bg);font-family:var(--font);color:var(--blue);font-weight:600}
.file-item a{color:var(--blue);font-size:11px;text-decoration:none;flex-shrink:0}
.file-item a:hover{text-decoration:underline}

/* REVISI BOX */
.revisi-box{background:var(--red-bg);border:1.5px solid rgba(180,35,24,.25);border-radius:var(--radius);padding:12px 14px}
.revisi-box .rv-lbl{font-size:10.5px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.revisi-box p{font-size:13px;color:var(--txt);font-weight:500}

/* TOAST */
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;font-family:var(--font);
  z-index:300;display:flex;align-items:center;gap:9px;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 32px rgba(0,0,0,.3);
  animation:fadeUp .2s ease;
}
[data-theme="light"] .toast{background:var(--navy)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* LOADER */
.loader{position:fixed;inset:0;background:rgba(15,25,40,.6);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;backdrop-filter:blur(3px)}
.spinner{width:34px;height:34px;border:3px solid rgba(47,111,237,.2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{font-size:13px;color:#fff;font-weight:600;font-family:var(--font)}

/* REPORT */
.report-stat{background:var(--bg3);border-radius:var(--radius);padding:14px;border:1.5px solid var(--bdr)}
.report-stat .rs-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.report-stat .rs-val{font-size:19px;font-weight:800;color:var(--txt);letter-spacing:-.02em}
.prog-bar-wrap{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.prog-bar{height:100%;border-radius:3px;transition:width .5s ease}

/* PETTY CASH */
.pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:20px}
.pc-card{background:var(--bg2);border:1.5px solid var(--bdr);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.pc-card:hover{border-color:var(--blue);box-shadow:0 4px 16px rgba(47,111,237,.1)}
.pc-card.active{border-color:var(--blue);background:var(--blue-bg)}
.pc-card-nama{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:4px}
.pc-card-jenis{font-size:11px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.pc-saldo{font-size:22px;font-weight:800;color:var(--txt);font-family:var(--mono);letter-spacing:-.02em}
.pc-saldo.low{color:var(--red)}
.pc-saldo.warn{color:var(--orange)}
.pc-mutasi-table{width:100%;border-collapse:collapse;font-size:12.5px}
.pc-mutasi-table th{text-align:left;padding:9px 12px;background:var(--bg3);color:var(--txt2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5px solid var(--bdr)}
.pc-mutasi-table td{padding:9px 12px;border-bottom:1px solid var(--bdr);color:var(--txt);vertical-align:middle}
.pc-mutasi-table tr:hover td{background:var(--bg3)}
.pc-mutasi-table .debit{color:var(--red);font-weight:600;font-family:var(--mono)}
.pc-mutasi-table .kredit{color:var(--green);font-weight:600;font-family:var(--mono)}
.pc-mutasi-table .saldo-cell{font-family:var(--mono);font-weight:600}
.coa-badge{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--blue-bg);color:var(--blue);font-weight:700;display:inline-block;font-family:var(--mono)}
.pc-warn-badge{background:var(--orange-bg);color:var(--orange);font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700}

/* KASBON: watermark logo TARDA samar di background */

  content:'';
  position:absolute; inset:0; pointer-events:none; z-index:0;

/* KASBON: tabel master pekerja */
.ktable-wrap{overflow-x:auto;border:1px solid var(--bdr);border-radius:var(--radius);background:var(--bg2)}
.ktable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:680px}
.ktable.ktable-compact{min-width:0} /* untuk tabel batch gaji: tidak perlu lebar minimum besar */
.ktable th{text-align:left;padding:10px 12px;background:var(--bg3);color:var(--txt2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--bdr);white-space:nowrap}
.ktable td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--txt);white-space:nowrap}
.ktable tr:hover td{background:rgba(255,255,255,.02)}
.ktable tr{cursor:pointer}
.kcat-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;display:inline-block}
.kcat-borongan{background:rgba(56,139,253,.15);color:#79c0ff}
.kcat-bulanan_penjahit{background:rgba(63,185,80,.15);color:#7ee787}
.kcat-bulanan_finishing{background:rgba(210,153,34,.15);color:#e3b341}
.ksaldo-pos{color:var(--orange);font-weight:600;font-family:'JetBrains Mono',monospace}
.ksaldo-zero{color:var(--txt3);font-family:'JetBrains Mono',monospace}

/* KASBON: kanban board mini (4/5 kolom, mirip board utama tapi mandiri) */
.kboard-wrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{flex:0 0 230px;display:flex;flex-direction:column;background:var(--bg2);border-radius:10px;border:1px solid var(--bdr);max-height:calc(100dvh - 220px)}
.kcol-hdr{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bdr);background:var(--bg3);border-radius:10px 10px 0 0}
.kcol-hdr .ico{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kcol-hdr .label{font-size:11px;font-weight:600;flex:1;color:var(--txt)}
.kcol-hdr .cnt{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:20px}
.kcards{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
.kcard{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--radius);padding:10px;cursor:pointer;transition:border-color .15s,transform .1s}
.kcard:hover{border-color:var(--bdr2);transform:translateY(-1px)}
.kcard-id{font-size:10px;color:var(--txt3);font-family:'JetBrains Mono',monospace}
.kcard-title{font-size:12.5px;font-weight:600;color:var(--txt);margin:3px 0 2px}
.kcard-sub{font-size:11px;color:var(--txt2);margin-bottom:4px}
.kcard-amount{font-size:13px;font-weight:600;color:var(--txt);font-family:'JetBrains Mono',monospace}

/* Batch item row (gaji mingguan/bulanan form) */
.batch-row{display:grid;grid-template-columns:1fr 110px 100px 100px 32px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.batch-row.header{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bdr)}
.batch-row input,.batch-row select{font-size:12px;padding:6px 7px}
.batch-summary{background:var(--bg3);border-radius:var(--radius);padding:10px 12px;margin-top:8px;font-size:12.5px}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* ── RESPONSIVE MOBILE ─────────────────────────────── */
@media (max-width: 640px) {
  body{font-size:14px}

  /* Topbar mobile */
  .topbar{padding:0 12px;gap:8px;height:52px;flex-shrink:0}
  .topbar h1{font-size:12px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
  .topbar-actions{gap:4px;flex-shrink:0}
  .tb-btn{font-size:0;padding:6px 8px;gap:0;min-width:34px;min-height:34px;justify-content:center}
  .tb-btn i{font-size:15px!important}
  .role-badge{font-size:9px;padding:2px 6px;flex-shrink:0}
  #topbar-name{display:none}
  #topbar-nav{display:none!important}
  #topbar-nav-div{display:none!important}
  .topbar-logo img{height:24px}
  .user-avatar{width:28px;height:28px;font-size:12px}

  /* Stats bar */
  .stats-bar{gap:10px;padding:0 10px;height:30px;flex-shrink:0}
  .stat-chip{font-size:10px}
  .stat-chip span:not(strong){display:none}

  /* Search bar mobile */
  .search-bar{padding:8px 12px;gap:6px;flex-wrap:wrap}
  .search-input-wrap{flex:1 1 100%;min-width:0;width:100%;padding:7px 12px;box-sizing:border-box}
  .search-input-wrap input{font-size:16px}
  .search-select{font-size:12px;padding:7px 8px;flex:1 1 auto;min-width:0;border-radius:8px}
  #filter-date-from, #filter-date-to{display:none}
  .search-bar > .tb-btn{flex-shrink:0}

  /* Board: kolom scroll horizontal */
  .board-wrap{padding:12px;gap:12px;align-items:stretch}
  .col{flex:0 0 82vw;max-width:310px}
  .cards{flex:1;min-height:0;overflow-y:auto}

  /* Card */
  .card{padding:10px}
  .card-name{font-size:13px}
  .card-amount{font-size:13px}

  /* Modal mobile: slide dari bawah */
  .overlay{padding:0;align-items:flex-end}
  .modal{
    max-width:100%;
    width:100%;
    max-height:90dvh;
    border-radius:16px 16px 0 0;
    border-bottom:none;
  }
  .modal-hdr{padding:14px 16px 12px}
  .modal-body{padding:12px 16px}
  .action-area{padding:10px 16px env(safe-area-inset-bottom,16px)}

  /* Form: semua field jadi 1 kolom */
  .row2{grid-template-columns:1fr}
  .section{margin-bottom:12px}
  input.fld,select.fld,textarea.fld{font-size:16px!important} /* cegah zoom iOS */

  /* Buttons: touch-friendly */
  .btn{min-height:48px;font-size:14px;padding:12px 16px}
  .add-btn{min-height:44px;padding:10px}

  /* Tax form */
  .tax-box{padding:10px}
  .tax-row{font-size:13px}

  /* Login card */
  .login-card{width:calc(100% - 32px);max-width:400px;padding:24px 20px;border-radius:12px}

  /* Upload */
  .upload-zone{padding:14px}
  .upload-zone .uz-ico{font-size:20px;margin-bottom:4px}

  /* Info grid */
  .info-grid{font-size:12px}
  .info-grid .v{font-size:11.5px}

  /* History */
  .hist-text{font-size:12px}
  .hist-time{font-size:10.5px}

  /* Report */
  .report-stat .rs-val{font-size:15px}

  /* Kasbon mobile */
  .menu-tab{font-size:11px;padding:8px 10px}
  .menu-tab i{font-size:12px!important}
  .kcol{flex:0 0 80vw;max-width:300px}
  .ktable{font-size:11.5px;min-width:600px}
  .ktable th,.ktable td{padding:7px 8px}
  .batch-row{grid-template-columns:1fr 90px 80px 80px 28px;gap:4px}
  .batch-row input,.batch-row select{font-size:16px!important;padding:5px 6px}

  /* Sidebar mobile: full overlay */
  .sidebar{top:0;width:78vw;max-width:280px;z-index:200;padding-top:0}
  #sidebar-hdr-mobile{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
  .sidebar-backdrop{z-index:190}
}

@media (max-width: 380px) {
  .col{flex:0 0 88vw}
  .kcol{flex:0 0 88vw}
}
</style>

const fmt  = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n);
const fmtD = d => {
  if (!d) return '-';
  try {
    const dt = new Date(d);
    if (isNaN(dt)) return String(d);
    return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'});
  } catch(e) { return String(d); }
};
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Format bulan "2026-06" → "Juni 2026". Defensif terhadap data lama yang
// mungkin tersimpan sebagai ISO timestamp akibat bug konversi Sheets.
const BULAN_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function fmtBulan(val) {
  if (!val) return '-';
  const str = String(val);
  // Format benar: "2026-06"
  let m = str.match(/^(\d{4})-(\d{2})$/);
  if (m) return BULAN_NAMES[parseInt(m[2],10)-1] + ' ' + m[1];
  // Fallback: data lama rusak jadi ISO timestamp, contoh "2026-05-31T17:00:00.000Z"
  const dt = new Date(str);
  if (!isNaN(dt)) {
    // Karena timestamp disimpan sebagai UTC 17:00 (=00:00 WIB hari berikutnya),
    // tambahkan 7 jam dulu agar bulan yang ditampilkan sesuai input asli
    const wib = new Date(dt.getTime() + 7*60*60*1000);
    return BULAN_NAMES[wib.getMonth()] + ' ' + wib.getFullYear();
  }
  return str;
}

  document.getElementById('app').style.display = 'flex';
  document.getElementById('topbar-role').textContent = ROLE_LABELS[user.role];

  // reset topbar nav
  const topbarNav = document.getElementById('topbar-nav');
  const topbarNavDiv = document.getElementById('topbar-nav-div');
  if (topbarNav) topbarNav.style.display = 'none';
  if (topbarNavDiv) topbarNavDiv.style.display = 'none';

  if (can('report') || isOwner()) {
    const elArsip = document.getElementById('btn-arsip');
    const elDash  = document.getElementById('btn-dashboard');
    if (elArsip) elArsip.style.display = 'flex';
    if (elDash)  elDash.style.display = 'flex';
    if (topbarNav) topbarNav.style.display = 'flex';
    if (topbarNavDiv) topbarNavDiv.style.display = 'block';
  }
  if (isOwner()) {
    const elInit = document.getElementById('btn-initdb');
    if (elInit) elInit.style.display = 'flex';
  }
  // User avatar initial
  const avatarEl = document.getElementById('user-avatar');
  if (avatarEl) avatarEl.textContent = (user.name||'U').charAt(0).toUpperCase();

  // Sidebar: tampilkan menu yang bisa diakses role ini
  const sidebarBtn = document.getElementById('btn-sidebar-toggle');
  const tabPC = document.getElementById('tab-pettycash');
  const tabKasbon = document.getElementById('tab-kasbon');
  const tabPembayaran = document.getElementById('tab-pembayaran');

  // Tampilkan menu Petty Cash di sidebar untuk yang punya akses
  if (canAccessPC() && tabPC) tabPC.style.display = 'flex';
  else if (tabPC) tabPC.style.display = 'none';

  // Tampilkan menu Kasbon di sidebar untuk yang punya akses
  if (canAccessKasbon() && tabKasbon) tabKasbon.style.display = 'flex';
  else if (tabKasbon) tabKasbon.style.display = 'none';

  const needsSidebar = canAccessKasbon() || canAccessPC();
  if (needsSidebar) {
    sidebarBtn.style.display = 'flex';
  } else {
    sidebarBtn.style.display = 'none';
  }

  // Route ke menu yang tepat berdasarkan role
  if (isRumahTangga()) {
    // Rumah Tangga Produksi: hanya akses Petty Cash
    if (tabPembayaran) tabPembayaran.style.display = 'none';
    if (tabKasbon) tabKasbon.style.display = 'none';
    switchMenu('pettycash');
  } else if (isKepalaProduksi()) {
    // Kepala Produksi: hanya akses Kasbon
    if (tabPembayaran) tabPembayaran.style.display = 'none';
    switchMenu('kasbon');
  } else {
    if (tabPembayaran) tabPembayaran.style.display = 'flex';
    switchMenu('pembayaran');
  }

  populateFilterOptions();
  loadAll();
}

async function apiGet(params) {
  const qs  = new URLSearchParams(params).toString();
  const res = await fetch(API + '?' + qs, {method:'GET', redirect:'follow'});
  const txt = await res.text();
  try { return JSON.parse(txt); } catch(e) { throw new Error('Response bukan JSON: ' + txt.slice(0,200)); }
}

async function apiPost(body) {
  const res = await fetch(API, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)});
  const txt = await res.text();
  try { return JSON.parse(txt); } catch(e) { throw new Error('Response bukan JSON: ' + txt.slice(0,200)); }
}

async function loadAll() {

  } catch(e) {
    showToast('Gagal konek ke database','ti-alert-triangle');
  }
  renderBoard(); renderStats();
  hideLoader();
}

// ─── Search & Filter ─────────────────────────────────────────
let activeFilters = { search:'', dept:'', tipe:'', dateFrom:'', dateTo:'' };

function getFilteredTrxs() {
  let result = trxs;
  const { search, dept, tipe, dateFrom, dateTo } = activeFilters;

  if (search) {
    const q = search.toLowerCase();
    result = result.filter(t =>
      (t.id||'').toLowerCase().includes(q) ||
      (t.name||'').toLowerCase().includes(q) ||
      (t.vendor||'').toLowerCase().includes(q) ||
      (t.pengaju||'').toLowerCase().includes(q) ||
      (t.invoice||'').toLowerCase().includes(q)
    );
  }
  if (dept) result = result.filter(t => t.dept === dept);
  if (tipe) result = result.filter(t => t.tipe === tipe);
  if (dateFrom) {
    const from = new Date(dateFrom + 'T00:00:00');
    result = result.filter(t => t.createdAt && new Date(t.createdAt) >= from);
  }
  if (dateTo) {
    const to = new Date(dateTo + 'T23:59:59');
    result = result.filter(t => t.createdAt && new Date(t.createdAt) <= to);
  }
  return result;
}

function applyFilters() {
  activeFilters.search   = document.getElementById('search-input')?.value.trim() || '';
  activeFilters.dept     = document.getElementById('filter-dept')?.value || '';
  activeFilters.tipe     = document.getElementById('filter-tipe')?.value || '';
  activeFilters.dateFrom = document.getElementById('filter-date-from')?.value || '';
  activeFilters.dateTo   = document.getElementById('filter-date-to')?.value || '';

  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.style.display = activeFilters.search ? 'flex' : 'none';

  renderBoard();
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  applyFilters();
}

function resetFilters() {
  document.getElementById('search-input').value = '';
  document.getElementById('filter-dept').value = '';
  document.getElementById('filter-tipe').value = '';
  document.getElementById('filter-date-from').value = '';
  document.getElementById('filter-date-to').value = '';
  applyFilters();
}

function populateFilterOptions() {
  const deptSel = document.getElementById('filter-dept');
  const tipeSel = document.getElementById('filter-tipe');
  if (!deptSel || !tipeSel) return;
  const curDept = deptSel.value, curTipe = tipeSel.value;
  deptSel.innerHTML = '<option value="">Semua Dept</option>' + DEPTS.map(d=>`<option value="${d}">${d}</option>`).join('');
  tipeSel.innerHTML = '<option value="">Semua Tipe</option>' + TIPES.map(t=>`<option value="${t}">${t}</option>`).join('');
  deptSel.value = curDept; tipeSel.value = curTipe;
}

// ─── Render Board ────────────────────────────────────────────
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const filtered = getFilteredTrxs();
  COLS.forEach(col => {
    const cards = filtered.filter(t => t.status === col.id);
    const canAdd = col.id === 'pengajuan' && (can('pengajuan') || isOwner());
    const colEl = document.createElement('div');
    colEl.className = 'col';
    const colTotal = filtered.filter(t=>t.status===col.id).reduce((s,t)=>s+(t.pajak?.nominalNet||t.nominal||0),0);
    colEl.innerHTML = `
      <div class="col-hdr">
        <div class="ico" style="background:${col.bg}"><i class="ti ${col.icon}" style="font-size:13px;color:${col.fg}"></i></div>
        <span class="label">${col.label}</span>
        <span class="cnt">${cards.length}</span>
      </div>
      <div class="col-total">${colTotal>0 ? fmt(colTotal) : ''}</div>
      <div class="cards" id="cards-${col.id}">
        ${cards.length===0 ? `<div style="text-align:center;padding:28px 12px;font-size:12px;color:var(--txt3);font-weight:600">Belum ada transaksi</div>` : cards.map(t => renderCardHTML(t, col)).join('')}
      </div>
      ${canAdd ? `<button class="add-btn" onclick="openAddModal()"><i class="ti ti-plus" style="font-size:12px"></i> Tambah Pengajuan</button>` : ''}
    `;
    board.appendChild(colEl);
    cards.forEach(t => {
      const el = document.getElementById('card-'+t.id);
      if (el) el.onclick = () => openTrxModal(t.id);
    });
  });
}

// Priority styles (browser-state only, not saved to Sheets)
const PRIORITY_STYLES = {
  'Tinggi': {bg:'#FBF0DC', fg:'#8A6116', dot:'#C9A15A'},
  'Sedang': {bg:'#E9EFFE', fg:'#2547A0', dot:'#2F6FED'},
  'Rendah': {bg:'#F1F0EC', fg:'#6B7280', dot:'#9CA3AF'},
};
// Priority state: { [trxId]: 'Tinggi'|'Sedang'|'Rendah' }
let trxPriority = {};

function getPriority(id) { return trxPriority[id] || 'Rendah'; }

function setPriority(id, val) {
  trxPriority[id] = val;
  // Update badge di card (jika card ada di board)
  const cardEl = document.getElementById('card-'+id);
  if (cardEl) {
    const ps = PRIORITY_STYLES[val];
    const badge = cardEl.querySelector('.card-priority');
    const dot   = cardEl.querySelector('.card-priority-dot');
    if (badge) { badge.style.background=ps.bg; badge.style.color=ps.fg; badge.lastChild.textContent=val; }
    if (dot)   dot.style.background = ps.dot;
  }
  // Update tombol priority di dalam modal tanpa tutup modal
  const PRIOS = ['Rendah','Sedang','Tinggi'];
  PRIOS.forEach(p => {
    const btn = document.getElementById('prio-btn-'+id+'-'+p);
    if (!btn) return;
    const ps = PRIORITY_STYLES[p];
    const active = val === p;
    btn.style.borderColor = active ? ps.dot : 'var(--bdr)';
    btn.style.background  = active ? ps.bg  : 'var(--bg3)';
    btn.style.color       = active ? ps.fg  : 'var(--txt2)';
  });
  // Update info urgent kalau ada
  const urgentInfo = document.getElementById('urgent-info-'+id);
  if (urgentInfo) {
    urgentInfo.style.display = val === 'Tinggi' ? 'block' : 'none';
  }
}

function renderCardHTML(t, col) {
  const hasRevisi = t.catatanRevisi && t.status === 'pengajuan';
  const net = t.pajak?.nominalNet != null ? t.pajak.nominalNet : t.nominal;
  const prio = getPriority(t.id);
  const ps = PRIORITY_STYLES[prio];
  const pengajuInitial = (t.pengaju||'?').charAt(0).toUpperCase();
  return `
    <div class="card" id="card-${t.id}">
      <div class="card-top">
        <span class="card-priority" style="background:${ps.bg};color:${ps.fg}">
          <span class="card-priority-dot" style="background:${ps.dot}"></span>${prio}
        </span>
        <span class="card-id">${t.id}</span>
      </div>
      <div class="card-name">${esc(t.name)}</div>
      <div class="card-vendor"><i class="ti ti-building" style="font-size:10px"></i>${esc(t.vendor)}</div>
      <div class="card-amount">${fmt(net)}</div>
      <div class="card-bottom">
        <span class="card-dept-badge">${esc(t.dept)}</span>
        <div class="card-approver">
          ${hasRevisi ? `<span class="card-rev-badge">REVISI</span>` : ''}
          ${t.pajak ? `<i class="ti ti-receipt-tax" style="font-size:11px;color:var(--blue)"></i>` : ''}

}

function renderStats() {
  const bar = document.getElementById('stats-bar');
  const totalSelesai = trxs.filter(t=>t.status==='bukti').length;
  const totalPajak   = trxs.reduce((s,t)=>s+(t.pajak?.nominalPajak||0),0);
  bar.innerHTML = COLS.map(c => {
    const cnt = trxs.filter(t=>t.status===c.id).length;
    return `<div class="stat-chip"><div class="dot" style="background:${c.acc}"></div><span>${c.label.split(' ').slice(0,2).join(' ')}</span><strong>${cnt}</strong></div>`;
  }).join('') +
  `<div style="margin-left:auto;display:flex;gap:20px">
    <div class="stat-chip"><i class="ti ti-circle-check" style="color:var(--green);font-size:13px"></i><span>Selesai</span><strong>${totalSelesai}</strong></div>
    <div class="stat-chip"><i class="ti ti-receipt" style="color:var(--orange);font-size:13px"></i><span>Total Pajak</span><strong>${fmt(totalPajak)}</strong></div>
  </div>`;
}

// ─── Render History ──────────────────────────────────────────
// Support dua format:
//   1. Array of { msg, ts, col, label } (dari backend baru)
//   2. String teks per baris: "[04 Jun 2026 22:28 WIB] Pesan" (fallback)
function parseHistoryFrontend(raw) {
  if (!raw) return [];
  // Sudah jadi array (dari backend)
  if (Array.isArray(raw)) return raw;
  // String teks per baris
  const lines = String(raw).split('\n').filter(Boolean);
  return lines.map(line => {
    const m = line.match(/^\[(.+?)\] (.+)$/);
    return { msg: m ? m[2] : line, label: m ? m[1] : '', col: 'pengajuan' };
  });
}

function renderHistory(raw) {
  const entries = parseHistoryFrontend(raw);
  if (entries.length === 0) return '<div style="font-size:12px;color:var(--txt3)">Belum ada riwayat.</div>';
  return [...entries].reverse().map(h => {
    const hcol = COLS.find(c => c.id === h.col) || COLS[0];
    const timeStr = h.label || (h.ts ? fmtD(h.ts) : '');
    return `<div class="hist-item">
      <div class="hist-dot" style="background:${hcol.acc}"></div>
      <div>
        <div class="hist-text">${esc(h.msg)}</div>
        ${timeStr ? `<div class="hist-time">${esc(timeStr)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ─── Toast ───────────────────────────────────────────────────
function showToast(msg, icon='ti-check') {
  const el = document.getElementById('toast');
  el.innerHTML = `<i class="ti ${icon}" style="font-size:15px;color:var(--green)"></i> ${msg}`;
  el.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.style.display='none', 3000);
}

// ─── UPDATE TRX ──────────────────────────────────────────────
async function updateTrx(id, patch, histMsg) {
  showLoader('Menyimpan...');
  try {
    const res = await apiPost({action:'updateTrx', id, patch, histMsg});
    if (res.ok) {
      const idx = trxs.findIndex(t=>t.id===id);
      if (idx !== -1) {
        trxs[idx] = {...trxs[idx], ...patch};
        if (!trxs[idx].history) trxs[idx].history = [];
        trxs[idx].history.push({msg:histMsg, ts:new Date().toISOString(), col:patch.status||trxs[idx].status});
      }
      renderBoard(); renderStats();
    } else { showToast('Gagal menyimpan: '+(res.error||'?'),'ti-alert-triangle'); }
  } catch(e) { showToast('Error koneksi','ti-alert-triangle'); }
  hideLoader();
}

// Format input nominal dengan titik ribuan otomatis
function formatNominalInput(el) {
  const pos   = el.selectionStart;
  const prev  = el.value.length;
  const raw   = el.value.replace(/\D/g, '');
  const formatted = raw ? Number(raw).toLocaleString('id-ID') : '';
  el.value = formatted;
  // Pertahankan posisi kursor
  const diff = formatted.length - prev;
  el.setSelectionRange(pos + diff, pos + diff);
}

function onBankChange(key) {
  const sel = document.getElementById('f-bank');
  const manual = document.getElementById('f-bank-manual');
  if (!sel || !manual) return;
  manual.style.display = sel.value === '__lain__' ? 'block' : 'none';
  if (sel.value === '__lain__') manual.focus();
}

function getBankValue() {
  const sel = document.getElementById('f-bank');
  if (!sel) return '';
  if (sel.value === '__lain__') {
    return (document.getElementById('f-bank-manual')?.value||'').trim();
  }
  return sel.value;
}

// ─── Generate Nomor Invoice Otomatis ────────────────────────
function getInvoicePrefix(role) {
  if (role === 'divisi_produksi')  return 'MP';
  if (role === 'divisi_marketing') return 'MM';
  if (role === 'sales')            return 'MO';
  return 'MU';
}

function generateInvoiceNo() {
  const role   = currentUser?.role || '';
  const prefix = getInvoicePrefix(role);

  // Format tanggal hari ini: DDMMYYYY
  const now = new Date();
  const dd  = String(now.getDate()).padStart(2,'0');
  const mm  = String(now.getMonth()+1).padStart(2,'0');
  const yyyy = now.getFullYear();
  const tgl  = dd + mm + yyyy;

  // Hitung berapa invoice dengan prefix+tanggal yang sama sudah ada di trxs (data lokal)
  const pattern = prefix + '-' + tgl + '-';
  const existing = trxs.filter(t => t.invoice && t.invoice.startsWith(pattern));
  const urut = String(existing.length + 1).padStart(3, '0');

  return prefix + '-' + tgl + '-' + urut;
}

async function submitAdd() {
  const name          = document.getElementById('f-name')?.value.trim();
  const pengaju       = document.getElementById('f-pengaju')?.value.trim();
  const vendor        = document.getElementById('f-vendor')?.value.trim();
  const nominal       = String(document.getElementById('f-nominal')?.value||'').replace(/\D/g,'');
  const noRekening    = document.getElementById('f-rek')?.value.trim();
  const namaTujuan    = document.getElementById('f-namatujuan')?.value.trim();
  if (!name||!pengaju||!vendor||!nominal) { showToast('Lengkapi field wajib','ti-alert-triangle'); return; }
  if (!noRekening||!namaTujuan) { showToast('No. Rekening dan Nama Tujuan wajib diisi','ti-alert-triangle'); return; }
  const data = {
    name, pengaju,
    dept:document.getElementById('f-dept').value,
    tipe:document.getElementById('f-tipe').value,
    tanggal:document.getElementById('f-tanggal').value,
    vendor,
    nominal:Number(nominal),
    deskripsi:document.getElementById('f-desk').value,
    noRekening,
    namaBank:getBankValue(),
    npwpNik:document.getElementById('f-npwp').value,
    namaTujuanRekening: namaTujuan,
  };
  showLoader('Menyimpan pengajuan...');
  try {
    const res = await apiPost({action:'addTrx', data});
    if (res.ok) {
      const newId  = res.id;
      const invNo  = res.invoice || '';
      const files  = window._pendingFiles?.add || [];
      for (const f of files) await uploadFileToDrive(newId, f.file, 'lampiran_pengajuan');
      showToast(newId + ' berhasil dibuat | ' + invNo, 'ti-file-plus');
      closeModal();
      await loadAll();
    } else { showToast('Gagal: '+(res.error||'?'),'ti-alert-triangle'); }
  } catch(e) { showToast('Error: '+e,'ti-alert-triangle'); }
  hideLoader();
}

    name,
    pengaju:document.getElementById('f-pengaju').value,
    dept:document.getElementById('f-dept').value,
    tipe:document.getElementById('f-tipe').value,
    tanggal:document.getElementById('f-tanggal').value,
    vendor,
    invoice:document.getElementById('f-invoice').value,
    nominal:Number(nominal),
    deskripsi:document.getElementById('f-desk').value,
    noRekening:document.getElementById('f-rek').value,
    namaBank:getBankValue(),
    npwpNik:document.getElementById('f-npwp').value,

      closeModal();
      await loadAll();

}

        ${t.makerId?`<div class="section"><label>Nomor Maker</label><div class="fld" style="font-family:'JetBrains Mono',monospace;font-size:12px">${esc(t.makerId)}</div></div>`:''}
        ${t.buktNo?`<div class="section"><label>Nomor Bukti Transaksi</label><div class="fld" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--green)">${esc(t.buktNo)}</div></div>`:''}

        <!-- Lampiran: lazy load -->
        <div class="section">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <label style="margin-bottom:0">Lampiran & Bukti</label>
            <button class="tb-btn" onclick="loadFilesModal('${id}')" style="font-size:11px;padding:3px 8px">
              <i class="ti ti-paperclip" style="font-size:11px"></i> Lihat File
            </button>
          </div>
          <div id="files-container-${id}" style="font-size:12px;color:var(--txt3)">Klik "Lihat File" untuk memuat lampiran</div>
        </div>

        <div class="section">
          <label>Riwayat</label>
          ${renderHistory(t.history)}
        </div>
      </div>
      ${buildActionHTML(t)}
    </div>
  </div>`;
  document.getElementById('modal-area').innerHTML = html;
  window._pendingFiles = window._pendingFiles || {};
  window._currentTrxId = id;
}

// Lazy load files — dipanggil hanya saat user klik "Lihat File"
async function loadFilesModal(trxId) {
  const container = document.getElementById('files-container-'+trxId);
  if (!container) return;
  container.innerHTML = '<span style="color:var(--txt3);font-size:12px">Memuat file...</span>';
  try {
    const res = await apiGet({action:'getFiles', trxId});
    const files = res.ok ? res.data : [];
    const lampiran  = files.filter(f=>f.category==='lampiran_pengajuan');
    const buktiBayar= files.filter(f=>f.category==='bukti_bayar');
    if (files.length===0) { container.innerHTML='<span style="color:var(--txt3);font-size:12px">Belum ada file.</span>'; return; }
    container.innerHTML = [
      lampiran.length>0 ? `<div style="font-size:10px;color:var(--txt3);font-weight:700;text-transform:uppercase;margin-bottom:4px">Lampiran</div>`+
        lampiran.map(f=>`<div class="file-item"><i class="ti ti-paperclip" style="font-size:13px;color:var(--txt3)"></i><span class="fi-name">${esc(f.fileName)}</span><span class="fi-cat">Lampiran</span><a href="${f.driveUrl}" target="_blank"><i class="ti ti-external-link" style="font-size:12px"></i> Buka</a></div>`).join('') : '',
      buktiBayar.length>0 ? `<div style="font-size:10px;color:var(--txt3);font-weight:700;text-transform:uppercase;margin:8px 0 4px">Bukti Bayar</div>`+
        buktiBayar.map(f=>`<div class="file-item"><i class="ti ti-receipt" style="font-size:13px;color:var(--green)"></i><span class="fi-name">${esc(f.fileName)}</span><span class="fi-cat" style="background:var(--green-bg);color:var(--green)">Bukti</span><a href="${f.driveUrl}" target="_blank"><i class="ti ti-external-link" style="font-size:12px"></i> Buka</a></div>`).join('') : '',
    ].join('');
  } catch(e) {
    container.innerHTML='<span style="color:var(--red);font-size:12px">Gagal memuat file.</span>';
  }
}

// ─── Action HTML per status ──────────────────────────────────
function buildActionHTML(t) {
  const owner = isOwner();

  // PENGAJUAN — Admin + Owner: edit & kirim. Finance + Owner: kirim saja
  if (t.status === 'pengajuan') {
    const adminAct   = isAdmin() || owner;
    const financeAct = can('finance');
    if (!adminAct && !financeAct) return '';
    let html = `<div class="action-area">`;
    if (adminAct) {
      html += `
        <button class="btn btn-warn" onclick="openEditModal('${t.id}')">
          <i class="ti ti-edit" style="font-size:14px"></i> Edit Berkas Pengajuan
        </button>`;
    }
    html += `
        <button class="btn btn-primary" onclick="doAction('${t.id}',{status:'verifikasi_berkas',catatanRevisi:''},'Berkas dikirim ke Verifikasi Berkas oleh ${esc(currentUser.name)}')">
          <i class="ti ti-send" style="font-size:14px"></i> Kirim ke Verifikasi Berkas
        </button>
      </div>`;
    return html;
  }

  // VERIFIKASI BERKAS — Finance + Owner
  if (t.status === 'verifikasi_berkas') {
    if (!can('finance') && !owner) return '';
    const curPrio = getPriority(t.id);
    const PRIOS = ['Rendah','Sedang','Tinggi'];
    return `<div class="action-area">
      <div>
        <label style="font-size:10.5px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;display:block">⚡ Priority Transaksi</label>
        <div style="display:flex;gap:6px">
          ${PRIOS.map(p => {
            const ps = PRIORITY_STYLES[p];
            const active = curPrio === p;
            return `<button id="prio-btn-${t.id}-${p}" onclick="setPriority('${t.id}','${p}')"
              style="flex:1;padding:7px 4px;border-radius:8px;border:2px solid ${active?ps.dot:'var(--bdr)'};
              background:${active?ps.bg:'var(--bg3)'};color:${active?ps.fg:'var(--txt2)'};
              font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;
              display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s">
              <span style="width:7px;height:7px;border-radius:50%;background:${ps.dot};display:inline-block"></span>${p}
            </button>`;
          }).join('')}
        </div>
        <div id="urgent-info-${t.id}" style="display:${curPrio==='Tinggi'?'block':'none'};margin-top:8px;padding:8px 10px;background:var(--gold-bg);border-radius:8px;border:1px solid var(--gold);font-size:12px;color:var(--gold-fg);font-weight:600">
          ⚡ <strong>Urgent:</strong> Transaksi akan langsung ke Maker (lewati Verifikasi Pajak). Pajak bisa dihitung di Bukti Transaksi.</div>
      </div>
      <button class="btn btn-success" onclick="doVerifikasiBerkas('${t.id}')">
        <i class="ti ti-circle-check" style="font-size:14px"></i> Berkas Lengkap
      </button>
      <div>
        <label style="font-size:10.5px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block">Catatan Revisi (jika dikembalikan)</label>
        <textarea class="fld" id="catatan-revisi" placeholder="Tulis catatan untuk pengaju..." style="min-height:50px;width:100%"></textarea>
      </div>
      <button class="btn btn-danger" onclick="doRevisi('${t.id}')">
        <i class="ti ti-arrow-back" style="font-size:14px"></i> Kembalikan untuk Revisi
      </button>
    </div>`;
  }

  // VERIFIKASI PAJAK — Finance + Owner
  if (t.status === 'verifikasi_pajak') {
    if (!can('finance') && !owner) return '';
    return `<div class="action-area" id="pajak-action">
      <div style="display:flex;gap:8px">
        <button class="btn btn-success" style="flex:1" onclick="setPajakChoice(false,'${t.id}')">
          <i class="ti ti-x" style="font-size:14px"></i> Tidak Ada Pajak
        </button>
        <button class="btn btn-warn" style="flex:1" onclick="setPajakChoice(true,'${t.id}')">
          <i class="ti ti-receipt-tax" style="font-size:14px"></i> Ada Pajak
        </button>
      </div>
    </div>`;
  }

  // MAKER — Finance + Owner
  if (t.status === 'maker') {
    if (!can('finance') && !owner) return '';
    return `<div class="action-area">
      <button class="btn btn-success" onclick="doMaker('${t.id}')">
        <i class="ti ti-user-check" style="font-size:14px"></i> Buat & Approve Maker Transaksi
      </button>
    </div>`;
  }

  // RELEASER — Releaser BOD + Owner
  if (t.status === 'releaser') {
    if (!can('releaser') && !owner) return '';
    return `<div class="action-area">
      <button class="btn btn-teal" onclick="doReleaser('${t.id}')">
        <i class="ti ti-player-play" style="font-size:14px"></i> Tandai Sudah Dieksekusi BOD
      </button>
    </div>`;
  }

  // BUKTI — Finance + Owner upload; semua bisa lihat
  if (t.status === 'bukti') {
    let html = `<div class="action-area">
      <div style="padding:10px 12px;background:var(--green-bg);border-radius:var(--radius);border:1px solid rgba(63,185,80,.3)">
        <div style="display:flex;align-items:center;gap:8px">
          <i class="ti ti-circle-check" style="font-size:16px;color:var(--green)"></i>
          <span style="font-size:13px;font-weight:600;color:var(--green)">${esc(t.buktNo||'Selesai')}</span>
        </div>
      </div>`;
    if (can('finance') || owner) {
      html += `
      <div>
        <label style="font-size:10.5px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block">Upload Bukti Pembayaran</label>
        <div class="upload-zone" id="uz-bukti" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event,'bukti')" onclick="document.getElementById('fi-bukti').click()">
          <div class="uz-ico"><i class="ti ti-receipt-2"></i></div>
          <p>Klik untuk upload bukti transfer</p>
          <small>PDF, JPG, PNG, max 10MB</small>
          <input type="file" id="fi-bukti" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="handleFileSelect(this,'bukti')">
        </div>
        <div class="file-list" id="fl-bukti"></div>
        <button class="btn btn-purple" style="margin-top:8px;width:100%" onclick="uploadBuktiBayar('${t.id}')">
          <i class="ti ti-upload" style="font-size:14px"></i> Simpan Bukti Pembayaran
        </button>
      </div>`;
    }
    html += `</div>`;
    return html;
  }
  return '';
}

// ─── Action helpers ──────────────────────────────────────────
async function doAction(id, patch, histMsg) {
  await updateTrx(id, patch, histMsg);
  closeModal();
}

async function doVerifikasiBerkas(id) {
  const prio = getPriority(id);
  if (prio === 'Tinggi') {
    // URGENT: lewati Verifikasi Pajak, langsung ke Maker
    await doAction(id, {status:'maker'}, 'Berkas lengkap (Urgent) — langsung ke Maker, pajak dihitung belakangan');
  } else {
    await doAction(id, {status:'verifikasi_pajak'}, 'Berkas dinyatakan lengkap dan valid');
  }
}

async function doRevisi(id) {
  const catatan = document.getElementById('catatan-revisi')?.value.trim();
  if (!catatan) { showToast('Tulis catatan revisi terlebih dahulu','ti-alert-triangle'); return; }
  await updateTrx(id, {status:'pengajuan', catatanRevisi:catatan}, 'Berkas dikembalikan: '+catatan);
  closeModal();
}

async function doMaker(id) {
  const mkr = 'MKR-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*9000)+1000);
  await updateTrx(id, {status:'releaser',makerId:mkr}, 'Maker '+mkr+' dibuat dan diapprove');
  closeModal();
}

async function doReleaser(id) {
  const t   = trxs.find(x=>x.id===id);
  const bt  = 'BT-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*9000)+1000);
  const net = t?.pajak?.nominalNet || t?.nominal || 0;
  await updateTrx(id, {status:'bukti',buktNo:bt,tgSent:true},
    'Transaksi dieksekusi BOD, bukti '+bt+' diterbitkan');
  closeModal();
}

// ─── Pajak UI ────────────────────────────────────────────────
let _pajakState = {type:'pph23', rate:2, grossUp:false, mode:'auto'};

function setPajakChoice(ada, trxId) {
  const area = document.getElementById('pajak-action');
  if (!ada) {
    area.innerHTML = `<button class="btn btn-success" onclick="doAction('${trxId}',{status:'maker',pajak:null},'Bebas pajak, lanjut ke Maker')">
      <i class="ti ti-arrow-right" style="font-size:14px"></i> Lanjut ke Maker (Bebas Pajak)
    </button>`;
    return;
  }
  _pajakState = {type:'pph23', rate:2, grossUp:false, mode:'auto'};
  renderPajakForm(trxId);
}

function renderPajakForm(trxId) {
  const t = trxs.find(x=>x.id===trxId);
  const base = t?.nominal || 0;
  const area = document.getElementById('pajak-action');
  const isAuto = _pajakState.mode === 'auto';

  // Hitung nilai otomatis
  const selPajak = PAJAK_TYPES.find(p=>p.id===_pajakState.type) || PAJAK_TYPES[0];
  let autoNominalPajak=0, autoNominalNet=0, autoNominalGross=0;
  if (_pajakState.grossUp) {
    autoNominalGross = Math.round(base/(1-_pajakState.rate/100));
    autoNominalPajak = autoNominalGross-base; autoNominalNet = base;
  } else {
    autoNominalPajak = Math.round(base*(_pajakState.rate/100));
    autoNominalNet = base-autoNominalPajak; autoNominalGross = base;
  }

  area.innerHTML = `
    <!-- Toggle Auto/Manual -->
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <button onclick="_pajakState.mode='auto';renderPajakForm('${trxId}')" style="flex:1;padding:8px;border-radius:6px;border:1.5px solid ${isAuto?'var(--orange)':'var(--bdr)'};background:${isAuto?'var(--orange-bg)':'var(--bg3)'};color:${isAuto?'var(--orange)':'var(--txt2)'};font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">
        <i class="ti ti-calculator" style="font-size:13px"></i> Hitung Otomatis
      </button>
      <button onclick="_pajakState.mode='manual';renderPajakForm('${trxId}')" style="flex:1;padding:8px;border-radius:6px;border:1.5px solid ${!isAuto?'var(--blue)':'var(--bdr)'};background:${!isAuto?'var(--blue-bg)':'var(--bg3)'};color:${!isAuto?'var(--blue)':'var(--txt2)'};font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">
        <i class="ti ti-pencil" style="font-size:13px"></i> Input Manual
      </button>
    </div>

    ${isAuto ? `
    <!-- MODE OTOMATIS -->
    <div class="tax-box" style="margin-bottom:10px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div>
          <label class="slbl">Jenis Pajak</label>
          <select class="fld" id="pj-type" onchange="onPajakTypeChange('${trxId}')">
            ${PAJAK_TYPES.map(p=>`<option value="${p.id}"${p.id===_pajakState.type?' selected':''}>${p.label}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="slbl">Tarif</label>
          <select class="fld" id="pj-rate" onchange="_pajakState.rate=Number(this.value);renderPajakForm('${trxId}')">
            ${selPajak.rates.map(r=>`<option value="${r.r}"${r.r===_pajakState.rate?' selected':''}>${r.l}</option>`).join('')}
          </select>
        </div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px;cursor:pointer">
        <input type="checkbox" ${_pajakState.grossUp?'checked':''} onchange="_pajakState.grossUp=this.checked;renderPajakForm('${trxId}')">
        Gross Up (beban pajak ditanggung pemberi kerja)
      </label>
      <div class="divider"></div>
      <div class="tax-row"><span>Nominal Invoice</span><span>${fmt(base)}</span></div>
      ${_pajakState.grossUp?`<div class="tax-row"><span>Nominal Gross Up</span><span>${fmt(autoNominalGross)}</span></div>`:''}
      <div class="tax-row"><span>${selPajak.label} ${_pajakState.rate}%</span><span>${fmt(autoNominalPajak)}</span></div>
      <div class="tax-row total"><span>Net Diterima</span><span>${fmt(autoNominalNet)}</span></div>
    </div>
    <div style="margin-bottom:8px">
      <label class="slbl">Nomor Bukti Potong <span style="color:var(--red)">*</span></label>
      <input type="text" class="fld" id="pj-buktipotong" placeholder="Contoh: BP-2025-0001" style="width:100%">
    </div>
    <button class="btn btn-warn" onclick="submitPajakAuto('${trxId}',${base},${autoNominalPajak},${autoNominalNet},${autoNominalGross})">
      <i class="ti ti-file-certificate" style="font-size:14px"></i>
      ${_pajakState.grossUp?'Buat Bukti Potong & Kembalikan ke Pengajuan':'Buat Bukti Potong & Lanjut Maker'}
    </button>
    ${_pajakState.grossUp && t?.pajak?`
    <button class="btn btn-success" style="margin-top:6px" onclick="doAction('${trxId}',{status:'maker'},'Invoice revisi diterima, lanjut ke Maker')">
      <i class="ti ti-check" style="font-size:14px"></i> Invoice Revisi Diterima, Lanjut Maker
    </button>`:''}
    ` : `
    <!-- MODE MANUAL -->
    <div class="tax-box" style="margin-bottom:10px">
      <div style="display:grid;gap:8px">
        <div>
          <label class="slbl">Nominal Invoice (Rp)</label>
          <input type="text" class="fld" id="pm-invoice" placeholder="Nominal invoice" inputmode="numeric" style="width:100%">
        </div>
        <div>
          <label class="slbl">Nominal Gross Up (Rp) <span style="color:var(--txt3);font-weight:400;text-transform:none">(isi jika ada)</span></label>
          <input type="text" class="fld" id="pm-gross" placeholder="Kosongkan jika tidak ada gross up" inputmode="numeric" style="width:100%">
        </div>
        <div>
          <label class="slbl">Nominal Pajak (Rp)</label>
          <input type="text" class="fld" id="pm-pajak" placeholder="Jumlah pajak yang dipotong" inputmode="numeric" style="width:100%">
        </div>
        <div>
          <label class="slbl">Net Diterima (Rp)</label>
          <input type="text" class="fld" id="pm-net" placeholder="Jumlah yang diterima vendor" inputmode="numeric" style="width:100%">
        </div>
        <div>
          <label class="slbl">Jenis Pajak <span style="color:var(--txt3);font-weight:400;text-transform:none">(opsional)</span></label>
          <input type="text" class="fld" id="pm-jenis" placeholder="Contoh: PPh 23, PPN, dll" style="width:100%">
        </div>
      </div>
    </div>
    <div style="margin-bottom:8px">
      <label class="slbl">Nomor Bukti Potong <span style="color:var(--red)">*</span></label>
      <input type="text" class="fld" id="pj-buktipotong" placeholder="Contoh: BP-2025-0001" style="width:100%">
    </div>
    <button class="btn btn-warn" onclick="submitPajakManual('${trxId}')">
      <i class="ti ti-file-certificate" style="font-size:14px"></i> Simpan & Lanjut Maker
    </button>
    `}
  `;
}

function onPajakTypeChange(trxId) {
  const typeId = document.getElementById('pj-type').value;
  _pajakState.type = typeId;
  _pajakState.rate = PAJAK_TYPES.find(p=>p.id===typeId).rates[0].r;
  renderPajakForm(trxId);
}

async function submitPajakAuto(trxId, base, nominalPajak, nominalNet, nominalGross) {
  const bp = (document.getElementById('pj-buktipotong')?.value||'').trim();
  if (!bp) { showToast('Isi Nomor Bukti Potong terlebih dahulu','ti-alert-triangle'); return; }
  const selPajak = PAJAK_TYPES.find(p=>p.id===_pajakState.type);
  const pajakData = {
    type:_pajakState.type, typeLabel:selPajak.label,
    rate:_pajakState.rate, grossUp:_pajakState.grossUp,
    nominalPajak, nominalNet, buktiPotong:bp, manual:false
  };
  if (_pajakState.grossUp) {
    // FIX 5: gross up → kembalikan ke Pengajuan Dana agar vendor upload invoice revisi
    await updateTrx(trxId, {status:'pengajuan', pajak:pajakData, catatanRevisi:'Bukti potong '+bp+' telah diterbitkan. Mohon upload invoice revisi sesuai nominal gross up.'},
      'Bukti potong '+bp+' terbit. Menunggu invoice revisi dari vendor (dikembalikan ke Pengajuan)');
  } else {
    await updateTrx(trxId, {status:'maker', pajak:pajakData},
      'Pajak '+selPajak.label+' '+_pajakState.rate+'% = '+fmt(nominalPajak)+'. Net: '+fmt(nominalNet)+'. Bukti: '+bp);
  }
  closeModal();
}

async function submitPajakManual(trxId) {
  const bp     = (document.getElementById('pj-buktipotong')?.value||'').trim();
  const inv    = Number(String(document.getElementById('pm-invoice')?.value||'').replace(/\D/g,''));
  const pajak  = Number(String(document.getElementById('pm-pajak')?.value||'').replace(/\D/g,''));
  const net    = Number(String(document.getElementById('pm-net')?.value||'').replace(/\D/g,''));
  const gross  = Number(String(document.getElementById('pm-gross')?.value||'').replace(/\D/g,''));
  const jenis  = (document.getElementById('pm-jenis')?.value||'').trim();
  if (!bp)    { showToast('Isi Nomor Bukti Potong','ti-alert-triangle'); return; }
  if (!inv)   { showToast('Isi Nominal Invoice','ti-alert-triangle'); return; }
  if (!pajak) { showToast('Isi Nominal Pajak','ti-alert-triangle'); return; }
  if (!net)   { showToast('Isi Nominal Net Diterima','ti-alert-triangle'); return; }
  const pajakData = {
    manual: true, typeLabel: jenis||'Manual', rate: null,
    grossUp: gross > 0, nominalGross: gross||null,
    nominalPajak: pajak, nominalNet: net, buktiPotong: bp
  };
  await updateTrx(trxId, {status:'maker', pajak:pajakData},
    'Pajak manual: '+fmt(pajak)+'. Net: '+fmt(net)+'. Bukti: '+bp);
  closeModal();
}

// ─── File Upload ─────────────────────────────────────────────
function handleFileSelect(input, key) {
  if (!window._pendingFiles) window._pendingFiles = {};
  if (!window._pendingFiles[key]) window._pendingFiles[key] = [];
  Array.from(input.files).forEach(f=>window._pendingFiles[key].push({file:f,name:f.name}));
  renderPendingFiles(key);
}
function handleDrop(e, key) {
  e.preventDefault();
  document.getElementById('uz-'+key)?.classList.remove('drag');
  if (!window._pendingFiles) window._pendingFiles = {};
  if (!window._pendingFiles[key]) window._pendingFiles[key] = [];
  Array.from(e.dataTransfer.files).forEach(f=>window._pendingFiles[key].push({file:f,name:f.name}));
  renderPendingFiles(key);
}
function renderPendingFiles(key) {
  const container = document.getElementById('fl-'+key);
  if (!container) return;
  const files = window._pendingFiles?.[key] || [];
  container.innerHTML = files.map((f,i)=>`
    <div class="file-item">
      <i class="ti ti-file" style="font-size:13px;color:var(--txt3)"></i>
      <span class="fi-name">${esc(f.name)}</span>
      <button onclick="removePendingFile('${key}',${i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;flex-shrink:0"><i class="ti ti-x"></i></button>
    </div>`).join('');
}
function removePendingFile(key,idx) {
  if (window._pendingFiles?.[key]) { window._pendingFiles[key].splice(idx,1); renderPendingFiles(key); }
}
async function uploadFileToDrive(trxId, file, category) {
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = async e=>{
      const base64 = e.target.result.split(',')[1];
      try {
        const res = await apiPost({action:'uploadFile',trxId,category,fileName:file.name,mimeType:file.type||'application/octet-stream',base64,uploadedBy:currentUser.name});
        resolve(res);
      } catch(err){ resolve({ok:false}); }
    };
    reader.readAsDataURL(file);
  });
}
async function uploadBuktiBayar(trxId) {
  const files = window._pendingFiles?.bukti||[];
  if (files.length===0){ showToast('Pilih file terlebih dahulu','ti-alert-triangle'); return; }
  showLoader('Mengupload bukti pembayaran...');
  for (const f of files) await uploadFileToDrive(trxId, f.file, 'bukti_bayar');
  showToast('Bukti pembayaran berhasil diupload','ti-receipt');
  hideLoader();
  closeModal();
  await openTrxModal(trxId);
}

function switchMenu(menu) {
  currentMenu = menu;
  ['pembayaran','kasbon','pettycash'].forEach(m => {
    document.getElementById('tab-'+m)?.classList.toggle('active', m===menu);
    const el = document.getElementById('menu-content-'+m);
    if (el) el.style.display = m===menu ? 'flex' : 'none';
  });

  const titles = {pembayaran:'TARDA Finance Hub', kasbon:'Kasbon & Upah Pekerja', pettycash:'Petty Cash'};
  document.getElementById('app-title').textContent = titles[menu] || 'TARDA Finance Hub';

  closeSidebar();

  if (menu === 'pembayaran') {
    renderBoard(); renderStats();

    if (el) el.style.display = isOwner() ? 'flex' : 'none';

// ─── Load semua data Kasbon ───────────────────────────────────
async function loadKasbonAll() {
  showLoader('Memuat data kasbon...');
  try {
    const [rPekerja, rKasbon, rGMing, rGBulan] = await Promise.all([
      apiGet({action:'getPekerja'}),
      apiGet({action:'getKasbon'}),
      apiGet({action:'getGajiMingguan'}),
      apiGet({action:'getGajiBulanan'}),
    ]);
    if (rPekerja.ok) pekerjaList = rPekerja.data || [];
    if (rKasbon.ok) kasbonList = rKasbon.data || [];
    if (rGMing.ok) gajiMingguanList = rGMing.data || [];
    if (rGBulan.ok) gajiBulananList = rGBulan.data || [];
  } catch(e) {
    showToast('Gagal memuat data kasbon','ti-alert-triangle');
  }
  renderKasbonBody();
  hideLoader();
}

function renderKasbonBody() {
  const body = document.getElementById('kasbon-body');
  if (!body) return;
  if (kasbonSubTab === 'master')          body.innerHTML = renderMasterPekerjaHTML();
  else if (kasbonSubTab === 'kasbon')      body.innerHTML = renderKasbonBoardHTML();
  else if (kasbonSubTab === 'gaji_mingguan') body.innerHTML = renderGajiMingguanBoardHTML();
  else if (kasbonSubTab === 'gaji_bulanan')  body.innerHTML = renderGajiBulananBoardHTML();
  attachKasbonClickHandlers();
}

function attachKasbonClickHandlers() {
  if (kasbonSubTab === 'master') {
    pekerjaList.forEach(p => {
      const el = document.getElementById('pkj-row-'+p.id);
      if (el) el.onclick = () => openPekerjaDetailModal(p.id);
    });
  } else if (kasbonSubTab === 'kasbon') {
    kasbonList.forEach(k => {
      const el = document.getElementById('kcard-'+k.id);
      if (el) el.onclick = () => openKasbonDetailModal(k.id);
    });
  } else if (kasbonSubTab === 'gaji_mingguan') {
    gajiMingguanList.forEach(g => {
      const el = document.getElementById('gmg-card-'+g.id);
      if (el) el.onclick = () => openGajiMingguanDetailModal(g.id);
    });
  } else if (kasbonSubTab === 'gaji_bulanan') {
    gajiBulananList.forEach(g => {
      const el = document.getElementById('gbl-card-'+g.id);
      if (el) el.onclick = () => openGajiBulananDetailModal(g.id);
    });
  }
}

function addRekeningRow() {
  const wrap = document.getElementById('rekening-wrap');
  if (!wrap) return;
  const count = wrap.querySelectorAll('.rekening-row').length;
  if (count >= 3) { showToast('Maksimal 3 rekening per pekerja','ti-alert-triangle'); return; }
  const div = document.createElement('div');
  div.innerHTML = renderRekeningForm([...getFormRekening(), {noRekening:'',namaBank:'',namaTujuan:''}]);
  wrap.innerHTML = div.innerHTML;
}

function removeRekeningRow(idx) {
  const list = getFormRekening();
  list.splice(idx, 1);
  const wrap = document.getElementById('rekening-wrap');
  if (wrap) { const div = document.createElement('div'); div.innerHTML = renderRekeningForm(list); wrap.innerHTML = div.innerHTML; }
}

function getFormRekening() {
  const wrap = document.getElementById('rekening-wrap');
  if (!wrap) return [];
  const rows = wrap.querySelectorAll('.rekening-row');
  const result = [];
  rows.forEach((row) => {
    result.push({
      noRekening: row.querySelector('.rek-no')?.value.trim() || '',
      namaBank:   row.querySelector('.rek-bank')?.value.trim() || '',
      namaTujuan: row.querySelector('.rek-tujuan')?.value.trim() || '',
    });
  });
  return result;
}

  const kat = document.getElementById('pk-kategori').value;

async function submitAddPekerja() {
  const nama = document.getElementById('pk-nama')?.value.trim();
  const kategori = document.getElementById('pk-kategori')?.value;
  if (!nama || !kategori) { showToast('Nama dan kategori wajib diisi','ti-alert-triangle'); return; }

  const rekeningArr = getFormRekening().filter(r => r.noRekening);
  if (rekeningArr.length === 0) { showToast('Minimal 1 rekening wajib diisi','ti-alert-triangle'); return; }

  const first = rekeningArr[0];
  const data = {
    nama, nik: document.getElementById('pk-nik')?.value.trim() || '',
    kategori,
    noRekening: first.noRekening,
    namaBank: first.namaBank,
    namaTujuanRekening: first.namaTujuan,
    rekening: rekeningArr,
    gajiFix: Number(String(document.getElementById('pk-gajifix')?.value||'').replace(/\D/g,'')) || 0,
    saldoKasbonAwal: Number(String(document.getElementById('pk-saldoawal')?.value||'').replace(/\D/g,'')) || 0,
  };

  showLoader('Menyimpan pekerja...');
  try {
    const res = await apiPost({action:'addPekerja', data});
    if (res.ok) {
      showToast('Pekerja '+nama+' berhasil ditambahkan','ti-user-plus');
      closeModal();
      await loadKasbonAll();
    } else { showToast('Gagal: '+(res.error||'?'),'ti-alert-triangle'); }
  } catch(e) { showToast('Error: '+e,'ti-alert-triangle'); }
  hideLoader();
}

function onKasbonPekerjaChange() {
  const pekerjaId = document.getElementById('ksb-pekerja')?.value;
  const wrap = document.getElementById('ksb-rekening-wrap');
  const sel  = document.getElementById('ksb-rekening');
  if (!wrap || !sel) return;

  if (!pekerjaId) { wrap.style.display = 'none'; return; }

  const p = pekerjaList.find(x => x.id === pekerjaId);
  if (!p) { wrap.style.display = 'none'; return; }

  // Kumpulkan semua rekening: array baru ATAU fallback ke kolom legacy
  let reks = [];
  if (Array.isArray(p.rekening) && p.rekening.length > 0) {
    reks = p.rekening;
  } else if (p.noRekening) {
    reks = [{
      noRekening: p.noRekening,
      namaBank: p.namaBank || '',
      namaTujuan: p.namaTujuanRekening || ''
    }];
  }

  // Selalu tampilkan dropdown rekening — baik 1 maupun lebih
  // supaya user tahu rekening tujuannya dan bisa konfirmasi
  if (reks.length === 0) {
    wrap.style.display = 'none';
    return;
  }

  wrap.style.display = 'block';
  sel.innerHTML = reks.map((r, i) =>
    `<option value="${i}" data-rek='${JSON.stringify(r).replace(/'/g,"&#39;")}'>
      ${esc(r.noRekening)} — ${esc(r.namaBank)} (${esc(r.namaTujuan)})
    </option>`
  ).join('');
}

// Helper: ambil rekening yang dipilih di form kasbon
function getSelectedKasbonRekening() {
  const pekerjaId = document.getElementById('ksb-pekerja')?.value;
  const p = pekerjaList.find(x => x.id === pekerjaId);
  if (!p) return {};

  const sel = document.getElementById('ksb-rekening');
  if (sel && sel.options.length > 0) {
    const opt = sel.options[sel.selectedIndex];
    try {
      const r = JSON.parse(opt.getAttribute('data-rek') || '{}');
      return { noRekening: r.noRekening, namaBank: r.namaBank, namaTujuanRekening: r.namaTujuan };
    } catch(e) {}
  }
  // Fallback ke rekening pertama dari array atau legacy
  const reks = Array.isArray(p.rekening) && p.rekening.length > 0
    ? p.rekening
    : [{noRekening: p.noRekening, namaBank: p.namaBank, namaTujuan: p.namaTujuanRekening}];
  const r = reks[0] || {};
  return { noRekening: r.noRekening||'', namaBank: r.namaBank||'', namaTujuanRekening: r.namaTujuan||'' };
}

async function exportPekerjaCSV() {
  showLoader('Menyiapkan data export...');
  try {
    const res = await apiGet({action:'exportPekerjaCSV'});
    if (!res.ok || !res.csv) { showToast('Tidak ada data untuk diexport','ti-alert-triangle'); hideLoader(); return; }

    // Download CSV
    const blob = new Blob(['\uFEFF'+res.csv], {type:'text/csv;charset=utf-8;'}); // BOM untuk Excel
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const now  = new Date();
    const tgl  = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    a.href     = url;
    a.download = 'Master_Pekerja_'+tgl+'.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast('Export berhasil — '+res.total+' pekerja','ti-file-spreadsheet');
  } catch(e) { showToast('Gagal export: '+e,'ti-alert-triangle'); }
  hideLoader();
}
