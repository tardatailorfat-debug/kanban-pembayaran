// ════════════════════════════════════════════════════════════

// Hitung lead time (jam) dari Pengajuan → Selesai, berdasarkan history
function calcLeadTimeHours(t) {
  if (!t.history || t.history.length === 0) return null;
  const sorted = [...t.history].filter(h=>h.ts).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  if (sorted.length === 0) return null;
  const start = new Date(sorted[0].ts);
  const endEntry = sorted.find(h => /dieksekusi BOD|bukti.*diterbitkan/i.test(h.msg));
  if (!endEntry) return null;
  const end = new Date(endEntry.ts);
  const diffMs = end - start;
  if (diffMs < 0) return null;
  return diffMs / (1000*60*60);
}

function getMonthKey(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function showDashboard() {
  if (!can('report') && !isOwner()) return;

  // Default: bulan ini
  const now = new Date();
  const defaultMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');

  document.getElementById('modal-area').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:640px">
      <div class="modal-hdr">
        <div class="m-icon" style="background:var(--purple-bg)"><i class="ti ti-layout-dashboard" style="font-size:16px;color:var(--purple)"></i></div>
        <div><h2>Dashboard Bulanan</h2><p>Ringkasan performa transaksi</p></div>
        <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="modal-body">
        <div class="section" style="display:flex;gap:8px;align-items:end">
          <div style="flex:1">
            <label class="slbl">Pilih Bulan</label>
            <input type="month" class="fld" id="dash-month" value="${defaultMonth}" onchange="renderDashboardContent()" style="width:100%">
          </div>
          <button class="btn btn-success" style="min-height:38px;padding:8px 14px" onclick="exportToExcel()">
            <i class="ti ti-file-spreadsheet" style="font-size:14px"></i> Export Excel
          </button>
        </div>
        <div id="dashboard-content"></div>
      </div>
    </div>
  </div>`;

  renderDashboardContent();
}

function renderDashboardContent() {
  const monthVal = document.getElementById('dash-month')?.value;
  if (!monthVal) return;

  // Filter trxs by bulan (berdasarkan createdAt)
  const monthTrxs = trxs.filter(t => getMonthKey(t.createdAt) === monthVal);

  const total    = monthTrxs.length;
  const totBruto = monthTrxs.reduce((s,t)=>s+(t.nominal||0),0);
  const selesai  = monthTrxs.filter(t=>t.status==='bukti').length;

  // Breakdown per divisi/departemen
  const byDept = {};
  monthTrxs.forEach(t => {
    const d = t.dept || 'Lainnya';
    if (!byDept[d]) byDept[d] = { count:0, total:0 };
    byDept[d].count++;
    byDept[d].total += (t.nominal||0);
  });
  const deptRows = Object.entries(byDept).sort((a,b)=>b[1].total-a[1].total);

  // Top 5 vendor
  const byVendor = {};
  monthTrxs.forEach(t => {
    const v = t.vendor || 'Lainnya';
    if (!byVendor[v]) byVendor[v] = { count:0, total:0 };
    byVendor[v].count++;
    byVendor[v].total += (t.nominal||0);
  });
  const topVendors = Object.entries(byVendor).sort((a,b)=>b[1].total-a[1].total).slice(0,5);

  // Lead time rata-rata (hanya transaksi yang sudah selesai & punya data lengkap)
  const leadTimes = monthTrxs.filter(t=>t.status==='bukti').map(calcLeadTimeHours).filter(v=>v!=null);
  const avgLeadTimeHours = leadTimes.length>0 ? leadTimes.reduce((a,b)=>a+b,0)/leadTimes.length : null;
  const avgLeadTimeLabel = avgLeadTimeHours!=null
    ? (avgLeadTimeHours < 24 ? avgLeadTimeHours.toFixed(1)+' jam' : (avgLeadTimeHours/24).toFixed(1)+' hari')
    : '-';

  const maxDeptTotal = deptRows.length>0 ? deptRows[0][1].total : 1;
  const maxVendorTotal = topVendors.length>0 ? topVendors[0][1].total : 1;

  const container = document.getElementById('dashboard-content');
  if (!container) return;
  container.innerHTML = `
    <div class="row2 section" style="gap:10px;margin-top:14px">
      <div class="report-stat"><div class="rs-lbl" style="color:var(--blue)">Total Transaksi</div><div class="rs-val">${total}</div></div>
      <div class="report-stat"><div class="rs-lbl" style="color:var(--green)">Selesai</div><div class="rs-val">${selesai}</div></div>
      <div class="report-stat"><div class="rs-lbl" style="color:var(--orange)">Total Nominal</div><div class="rs-val" style="font-size:13px">${fmt(totBruto)}</div></div>
      <div class="report-stat"><div class="rs-lbl" style="color:var(--purple)">Rata2 Lead Time</div><div class="rs-val" style="font-size:13px">${avgLeadTimeLabel}</div></div>
    </div>

    <div class="section">
      <label>Breakdown per Departemen</label>
      ${deptRows.length===0 ? `<p style="font-size:12px;color:var(--txt3);text-align:center;padding:12px 0">Tidak ada data di bulan ini.</p>` :
      deptRows.map(([dept, val])=>{
        const pct = Math.round(val.total/maxDeptTotal*100);
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span style="color:var(--txt)">${esc(dept)} <span style="color:var(--txt3)">(${val.count} trx)</span></span>
            <span style="font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px">${fmt(val.total)}</span>
          </div>
          <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%;background:var(--blue)"></div></div>
        </div>`;
      }).join('')}
    </div>

    <div class="section">
      <label>Top 5 Vendor (berdasarkan nominal)</label>
      ${topVendors.length===0 ? `<p style="font-size:12px;color:var(--txt3);text-align:center;padding:12px 0">Tidak ada data.</p>` :
      topVendors.map(([vendor, val], i)=>{
        const pct = Math.round(val.total/maxVendorTotal*100);
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span style="color:var(--txt)">${i+1}. ${esc(vendor)} <span style="color:var(--txt3)">(${val.count}x)</span></span>
            <span style="font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px">${fmt(val.total)}</span>
          </div>
          <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%;background:var(--orange)"></div></div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// ════════════════════════════════════════════════════════════
//  EXPORT EXCEL (download langsung dari browser via SheetJS)
// ════════════════════════════════════════════════════════════
function loadSheetJS() {
  return new Promise((resolve, reject) => {
    if (window.XLSX) { resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Gagal memuat library Excel'));
    document.head.appendChild(script);
  });
}

async function exportToExcel() {
  const monthVal = document.getElementById('dash-month')?.value;
  showLoader('Menyiapkan file Excel...');
  try {
    await loadSheetJS();

    const monthTrxs = monthVal ? trxs.filter(t => getMonthKey(t.createdAt) === monthVal) : trxs;

    const rows = monthTrxs.map(t => {
      const net = t.pajak?.nominalNet != null ? t.pajak.nominalNet : t.nominal;
      const colLabel = COLS.find(c=>c.id===t.status)?.label || t.status;
      return {
        'ID': t.id,
        'Nama Pengajuan': t.name,
        'Pengaju': t.pengaju,
        'Departemen': t.dept,
        'Tipe': t.tipe,
        'Vendor': t.vendor,
        'No. Invoice': t.invoice,
        'Tanggal': fmtD(t.createdAt),
        'Nominal Bruto': t.nominal,
        'Nominal Pajak': t.pajak?.nominalPajak || 0,
        'Net Diterima': net,
        'No. Rekening': t.noRekening || '',
        'Nama Bank': t.namaBank || '',
        'Nama Tujuan Rekening': t.namaTujuanRekening || '',
        'NPWP/NIK': t.npwpNik || '',
        'Bukti Potong': t.pajak?.buktiPotong || '',
        'Nomor Maker': t.makerId || '',
        'Nomor Bukti': t.buktNo || '',
        'Status': colLabel,
      };
    });

    if (rows.length === 0) {
      showToast('Tidak ada data untuk diexport pada periode ini', 'ti-alert-triangle');
      hideLoader();
      return;
    }

    const ws = XLSX.utils.json_to_sheet(rows);
    // Atur lebar kolom otomatis (perkiraan)
    const colWidths = Object.keys(rows[0]).map(key => {
      const maxLen = Math.max(key.length, ...rows.map(r => String(r[key]||'').length));
      return { wch: Math.min(maxLen + 2, 40) };
    });
    ws['!cols'] = colWidths;

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Transaksi');

    const filename = 'Laporan_Kanban_' + (monthVal || 'Semua') + '.xlsx';
    XLSX.writeFile(wb, filename);

    showToast('File Excel berhasil didownload', 'ti-file-spreadsheet');
  } catch(e) {
    showToast('Gagal export: ' + e.message, 'ti-alert-triangle');
  }
  hideLoader();
}
