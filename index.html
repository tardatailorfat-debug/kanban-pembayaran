async function updateKasbonStatus(id, patch, histMsg) {
  // OPTIMISTIC UPDATE: ubah state lokal & UI dulu, baru kirim ke server.
  // User tidak perlu menunggu Apps Script untuk melihat perubahan.
  const idx = kasbonList.findIndex(k=>k.id===id);
  const backup = idx!==-1 ? {...kasbonList[idx]} : null;
  if (idx!==-1) {
    kasbonList[idx] = {...kasbonList[idx], ...patch};
    if (histMsg) {
      const hist = Array.isArray(kasbonList[idx].history) ? [...kasbonList[idx].history] : [];
      hist.push({msg:histMsg, ts:new Date().toISOString(), col:patch.status||kasbonList[idx].status, label:''});
      kasbonList[idx].history = hist;
    }
  }
  renderKasbonBody();
  closeModal();

  // Sinkronisasi ke server di background
  try {
    const res = await apiPost({action:'updateKasbon', id, patch, histMsg});
    if (!res.ok) {
      // Rollback kalau gagal
      if (idx!==-1 && backup) kasbonList[idx] = backup;
      renderKasbonBody();
      showToast('Gagal menyimpan ke server: '+(res.error||'?'),'ti-alert-triangle');
    }
  } catch(e) {
    if (idx!==-1 && backup) kasbonList[idx] = backup;
    renderKasbonBody();
    showToast('Gagal konek ke server, perubahan dibatalkan','ti-alert-triangle');
  }
}

async function updateGmingAndClose(id, patch, histMsg) {
  await updateGajiMingguanRemote(id, patch, histMsg);
}
async function updateGajiMingguanRemote(id, patch, histMsg) {
  // OPTIMISTIC UPDATE
  const idx = gajiMingguanList.findIndex(g=>g.id===id);
  const backup = idx!==-1 ? {...gajiMingguanList[idx]} : null;
  if (idx!==-1) {
    gajiMingguanList[idx] = {...gajiMingguanList[idx], ...patch};
    if (histMsg) {
      const hist = Array.isArray(gajiMingguanList[idx].history) ? [...gajiMingguanList[idx].history] : [];
      hist.push({msg:histMsg, ts:new Date().toISOString(), col:patch.status||gajiMingguanList[idx].status, label:''});
      gajiMingguanList[idx].history = hist;
    }
  }
  renderKasbonBody();
  closeModal();

  try {
    const res = await apiPost({action:'updateGajiMingguan', id, patch, histMsg});
    if (!res.ok) {
      if (idx!==-1 && backup) gajiMingguanList[idx] = backup;
      renderKasbonBody();
      showToast('Gagal menyimpan: '+(res.error||'?'),'ti-alert-triangle');
    }
  } catch(e) {
    if (idx!==-1 && backup) gajiMingguanList[idx] = backup;
    renderKasbonBody();
    showToast('Gagal konek ke server, perubahan dibatalkan','ti-alert-triangle');
  }
}
async function doMakerGming(id) {
  const mkr = 'MKR-G-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*9000)+1000);
  await updateGajiMingguanRemote(id, {status:'maker', makerId:mkr}, 'Maker '+mkr+' dibuat dan diapprove');
}
async function doReleaseGming(id) {
  const bt = 'BTG-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*9000)+1000);
  await updateGajiMingguanRemote(id, {status:'bukti', buktNo:bt}, 'Batch gaji dieksekusi BOD, bukti '+bt+' diterbitkan');
}

function updateGbulanItem(idx, field, val, inputEl) {
  // FIX: jangan render ulang seluruh list saat sedang mengetik (oninput),
  // karena innerHTML re-render menghancurkan elemen <input> yang sedang
  // difokus -> kursor & fokus hilang, user harus klik ulang tiap 1 digit.
  // Cukup update data + nilai "Diterima" di baris yang sama, lalu refresh summary saja.
  window._gbulanItems[idx][field] = Number(String(val||'').replace(/\D/g,'')) || 0;
  const it = window._gbulanItems[idx];
  it.gajiDiterima = (it.gajiFix||0) + (it.lembur||0) - (it.potonganKasbon||0);

  // Update tampilan "Diterima" di baris yang sama tanpa re-render seluruh list
  const row = inputEl ? inputEl.closest('.batch-row') : null;
  if (row) {
    const diterimaEl = row.querySelector('.gbl-diterima-val');
    if (diterimaEl) diterimaEl.textContent = fmt(it.gajiDiterima);
  }
  renderGbulanSummary();
}

  const container = document.getElementById('gbl-items-list');

  container.innerHTML = window._gbulanItems.map((it,i) => `

async function updateGbulanAndClose(id, patch, histMsg) {
  await updateGajiBulananRemote(id, patch, histMsg);
}
async function updateGajiBulananRemote(id, patch, histMsg) {
  // OPTIMISTIC UPDATE
  const idx = gajiBulananList.findIndex(g=>g.id===id);
  const backup = idx!==-1 ? {...gajiBulananList[idx]} : null;
  if (idx!==-1) {
    gajiBulananList[idx] = {...gajiBulananList[idx], ...patch};
    if (histMsg) {
      const hist = Array.isArray(gajiBulananList[idx].history) ? [...gajiBulananList[idx].history] : [];
      hist.push({msg:histMsg, ts:new Date().toISOString(), col:patch.status||gajiBulananList[idx].status, label:''});
      gajiBulananList[idx].history = hist;
    }
  }
  renderKasbonBody();
  closeModal();

  try {
    const res = await apiPost({action:'updateGajiBulanan', id, patch, histMsg});
    if (!res.ok) {
      if (idx!==-1 && backup) gajiBulananList[idx] = backup;
      renderKasbonBody();
      showToast('Gagal menyimpan: '+(res.error||'?'),'ti-alert-triangle');
    }
  } catch(e) {
    if (idx!==-1 && backup) gajiBulananList[idx] = backup;
    renderKasbonBody();
    showToast('Gagal konek ke server, perubahan dibatalkan','ti-alert-triangle');
  }
}
async function doMakerGbulan(id) {
  const mkr = 'MKR-GB-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*9000)+1000);
  await updateGajiBulananRemote(id, {status:'maker', makerId:mkr}, 'Maker '+mkr+' dibuat dan diapprove');
}
async function doReleaseGbulan(id) {
  const bt = 'BTGB-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*9000)+1000);
  await updateGajiBulananRemote(id, {status:'bukti', buktNo:bt}, 'Batch gaji bulanan dieksekusi BOD, bukti '+bt+' diterbitkan');
}

async function loadKasbonFilesInto(refId, refType) {
  const container = document.getElementById('kasbon-files-'+refId);
  if (!container) return;
  try {
    const res = await apiGet({action:'getKasbonFiles', refId});
    const files = res.ok ? res.data : [];
    if (files.length===0) { container.innerHTML = '<span style="color:var(--txt3)">Belum ada file bukti.</span>'; return; }
    container.innerHTML = files.map(f=>`
      <div class="file-item">
        <i class="ti ti-receipt" style="font-size:13px;color:var(--green)"></i>
        <span class="fi-name">${esc(f.fileName)}</span>
        <a href="${f.driveUrl}" target="_blank"><i class="ti ti-external-link" style="font-size:12px"></i> Buka</a>
      </div>`).join('');
  } catch(e) {
    container.innerHTML = '<span style="color:var(--red)">Gagal memuat file.</span>';
  }
}

function uploadKasbonFileToDrive(refId, refType, file, category) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = async e => {
      const base64 = e.target.result.split(',')[1];
      try {
        const res = await apiPost({
          action:'uploadKasbonFile', refId, refType, category,
          fileName:file.name, mimeType:file.type||'application/octet-stream',
          base64, uploadedBy:currentUser.name
        });
        resolve(res);
      } catch(err) { resolve({ok:false}); }
    };
    reader.readAsDataURL(file);
  });
}

async function uploadKasbonFileNow(refId, refType, input) {
  const file = input.files[0];
  if (!file) return;
  showLoader('Mengupload bukti...');
  await uploadKasbonFileToDrive(refId, refType, file, 'bukti_kasbon');
  showToast('Bukti berhasil diupload','ti-receipt');
  hideLoader();
  loadKasbonFilesInto(refId, refType);
}

async function uploadKasbonFileMulti(refId, refType, input) {
  const files = Array.from(input.files);
  if (files.length===0) return;
  showLoader('Mengupload '+files.length+' file...');
  for (const f of files) await uploadKasbonFileToDrive(refId, refType, f, 'bukti_gaji');
  showToast('Bukti berhasil diupload','ti-receipt');
  hideLoader();
  loadKasbonFilesInto(refId, refType);
}

function renderPCRingkasan() {
  const myDompet = getMyPCDompet();
  if (myDompet.length === 0) return `<div style="text-align:center;padding:40px;color:var(--txt3)">Tidak ada petty cash yang bisa diakses.</div>`;

  const active = myDompet.find(d=>d.id===pcActiveDompetId) || myDompet[0];
  const canEdit = isOwner() || can('finance');

  // Statistik periode ini (bulan berjalan)
  const now = new Date();
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
  const trxBulanIni = pcTrxList.filter(t => t.dompetId===active.id && new Date(t.tanggal) >= firstDay);
  const totalKeluar = trxBulanIni.reduce((s,t)=>s+(t.kredit||0),0);
  const totalMasuk  = trxBulanIni.reduce((s,t)=>s+(t.debit||0),0);

  // Breakdown COA bulan ini
  const byAkun = {};
  trxBulanIni.filter(t=>t.kredit>0).forEach(t => {
    const key = t.kodeAkun || '-';
    if (!byAkun[key]) byAkun[key] = {kode:t.kodeAkun, nama:t.namaAkun||PC_COA_MAP[t.kodeAkun]||'-', total:0};
    byAkun[key].total += t.kredit;

  const maxAkun = akunList[0]?.total || 1;

  const pctSaldo = active.topUpNominal > 0 ? Math.round((active.saldo/active.topUpNominal)*100) : 100;

          background:${d.id===active.id?'var(--blue-bg)':'var(--bg2)'};color:${d.id===active.id?'var(--blue)':'var(--txt2)'};

      <div style="background:rgba(255,255,255,.15);border-radius:6px;height:6px;margin-bottom:8px">

      </div>

async function submitPCTrx() {
  const tanggal   = document.getElementById('pc-tanggal')?.value;
  const nominal   = Number(String(document.getElementById('pc-nominal')?.value||'').replace(/\D/g,''));
  const coaEl     = document.getElementById('pc-coa');
  const kodeAkun  = coaEl?.value;
  const namaAkun  = coaEl?.options[coaEl.selectedIndex]?.text.split('—')[1]?.trim() || '';
  const keterangan = document.getElementById('pc-keterangan')?.value.trim();
  const fileInput  = document.getElementById('pc-bukti-file');

  if (!tanggal||!nominal||!kodeAkun||!keterangan) {
    showToast('Lengkapi semua field wajib','ti-alert-triangle'); return;
  }

  const active = pcDompetList.find(d=>d.id===pcActiveDompetId);

  showLoader('Menyimpan pengeluaran...');
  try {
    let buktiUrl = '';
    if (fileInput?.files[0]) {
      buktiUrl = await uploadPCBukti(pcActiveDompetId, fileInput.files[0]);
    }

    const res = await apiPost({action:'addPettyCashTrx', data:{
      pcId: pcActiveDompetId,
      namaDompet: active?.nama||'',
      tanggal, jenis:'keluar',
      kodeAkun, namaAkun, keterangan,
      nominal, buktiUrl,
      inputBy: currentUser?.name||'',
    }});

    if (res.ok) {
      showToast('Pengeluaran berhasil dicatat','ti-check');
      closeModal();
      await loadPCAll();
    } else { showToast('Gagal: '+(res.error||'?'),'ti-alert-triangle'); }
  } catch(e) { showToast('Error: '+e,'ti-alert-triangle'); }
  hideLoader();
}

// ─── Upload bukti ke Drive ────────────────────────────────────
async function uploadPCBukti(pcId, file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = async e => {
      const base64 = e.target.result.split(',')[1];
      try {
        const res = await apiPost({
          action:'uploadKasbonFile', refId:'PC_'+dompetId+'_'+Date.now(),
          refType:'pettycash', category:'bukti_pc',
          fileName:file.name, mimeType:file.type||'application/octet-stream',
          base64, uploadedBy:currentUser?.name||''
        });
        resolve(res.ok ? res.driveUrl : '');
      } catch(e) { resolve(''); }
    };
    reader.readAsDataURL(file);
  });
}

    } else showToast('Gagal: '+(res.error||'?'),'ti-alert-triangle');
  } catch(e) { showToast('Error: '+e,'ti-alert-triangle'); }
  hideLoader();
}

  showLoader('Menghapus...');
  try {
    const res = await apiPost({action:'deletePCTrx', id});
    if (res.ok) { showToast('Transaksi dihapus','ti-trash'); closeModal(); await loadPCAll(); }
    else showToast('Gagal: '+(res.error||'?'),'ti-alert-triangle');
  } catch(e) { showToast('Error: '+e,'ti-alert-triangle'); }
  hideLoader();
}

// ─── Export CSV ───────────────────────────────────────────────
async function exportPCTrxCSV() {
  const d = pcDompetList.find(x=>x.id===pcActiveDompetId);
  showLoader('Menyiapkan export...');
  try {
    const res = await apiGet({action:'exportPettyCashTrx', pcId:pcActiveDompetId});
    if (!res.ok||!res.csv) { showToast('Tidak ada data','ti-alert-triangle'); hideLoader(); return; }

    const blob = new Blob(['\uFEFF'+res.csv], {type:'text/csv;charset=utf-8;'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const tgl  = new Date().toISOString().slice(0,10);
    a.href     = url;
    a.download = 'PettyCash_'+(d?.nama||pcActiveDompetId).replace(/\s+/g,'_')+'_'+tgl+'.csv';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast('Export berhasil — '+res.total+' transaksi','ti-file-spreadsheet');
  } catch(e) { showToast('Gagal export: '+e,'ti-alert-triangle'); }
  hideLoader();

//  DASHBOARD BULANAN
// ════════════════════════════════════════════════════════════

// Hitung lead time (jam) dari Pengajuan → Selesai, berdasarkan history
function calcLeadTimeHours(t) {
  if (!t.history || t.history.length === 0) return null;
  const sorted = [...t.history].filter(h=>h.ts).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  if (sorted.length === 0) return null;
  const start = new Date(sorted[0].ts);
  const endEntry = sorted.find(h => /dieksekusi BOD|bukti.*diterbitkan/i.test(h.msg));
  if (!endEntry) return null;
  const end = new Date(endEntry.ts);
  const diffMs = end - start;
  if (diffMs < 0) return null;
  return diffMs / (1000*60*60);
}

function getMonthKey(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function showDashboard() {
  if (!can('report') && !isOwner()) return;

  // Default: bulan ini
  const now = new Date();
  const defaultMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');

  document.getElementById('modal-area').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:640px">
      <div class="modal-hdr">
        <div class="m-icon" style="background:var(--purple-bg)"><i class="ti ti-layout-dashboard" style="font-size:16px;color:var(--purple)"></i></div>
        <div><h2>Dashboard Bulanan</h2><p>Ringkasan performa transaksi</p></div>
        <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="modal-body">
        <div class="section" style="display:flex;gap:8px;align-items:end">
          <div style="flex:1">
            <label class="slbl">Pilih Bulan</label>
            <input type="month" class="fld" id="dash-month" value="${defaultMonth}" onchange="renderDashboardContent()" style="width:100%">
          </div>
          <button class="btn btn-success" style="min-height:38px;padding:8px 14px" onclick="exportToExcel()">
            <i class="ti ti-file-spreadsheet" style="font-size:14px"></i> Export Excel
          </button>
        </div>
        <div id="dashboard-content"></div>
      </div>
    </div>
  </div>`;

  renderDashboardContent();
}

function renderDashboardContent() {
  const monthVal = document.getElementById('dash-month')?.value;
  if (!monthVal) return;

  // Filter trxs by bulan (berdasarkan createdAt)
  const monthTrxs = trxs.filter(t => getMonthKey(t.createdAt) === monthVal);

  const total    = monthTrxs.length;
  const totBruto = monthTrxs.reduce((s,t)=>s+(t.nominal||0),0);
  const selesai  = monthTrxs.filter(t=>t.status==='bukti').length;

  // Breakdown per divisi/departemen
  const byDept = {};
  monthTrxs.forEach(t => {
    const d = t.dept || 'Lainnya';
    if (!byDept[d]) byDept[d] = { count:0, total:0 };
    byDept[d].count++;
    byDept[d].total += (t.nominal||0);
  });
  const deptRows = Object.entries(byDept).sort((a,b)=>b[1].total-a[1].total);

  // Top 5 vendor
  const byVendor = {};
  monthTrxs.forEach(t => {
    const v = t.vendor || 'Lainnya';
    if (!byVendor[v]) byVendor[v] = { count:0, total:0 };
    byVendor[v].count++;
    byVendor[v].total += (t.nominal||0);
  });
  const topVendors = Object.entries(byVendor).sort((a,b)=>b[1].total-a[1].total).slice(0,5);

  // Lead time rata-rata (hanya transaksi yang sudah selesai & punya data lengkap)
  const leadTimes = monthTrxs.filter(t=>t.status==='bukti').map(calcLeadTimeHours).filter(v=>v!=null);
  const avgLeadTimeHours = leadTimes.length>0 ? leadTimes.reduce((a,b)=>a+b,0)/leadTimes.length : null;
  const avgLeadTimeLabel = avgLeadTimeHours!=null
    ? (avgLeadTimeHours < 24 ? avgLeadTimeHours.toFixed(1)+' jam' : (avgLeadTimeHours/24).toFixed(1)+' hari')
    : '-';

  const maxDeptTotal = deptRows.length>0 ? deptRows[0][1].total : 1;
  const maxVendorTotal = topVendors.length>0 ? topVendors[0][1].total : 1;

  const container = document.getElementById('dashboard-content');
  if (!container) return;
  container.innerHTML = `
    <div class="row2 section" style="gap:10px;margin-top:14px">
      <div class="report-stat"><div class="rs-lbl" style="color:var(--blue)">Total Transaksi</div><div class="rs-val">${total}</div></div>
      <div class="report-stat"><div class="rs-lbl" style="color:var(--green)">Selesai</div><div class="rs-val">${selesai}</div></div>
      <div class="report-stat"><div class="rs-lbl" style="color:var(--orange)">Total Nominal</div><div class="rs-val" style="font-size:13px">${fmt(totBruto)}</div></div>
      <div class="report-stat"><div class="rs-lbl" style="color:var(--purple)">Rata2 Lead Time</div><div class="rs-val" style="font-size:13px">${avgLeadTimeLabel}</div></div>
    </div>

    <div class="section">
      <label>Breakdown per Departemen</label>
      ${deptRows.length===0 ? `<p style="font-size:12px;color:var(--txt3);text-align:center;padding:12px 0">Tidak ada data di bulan ini.</p>` :
      deptRows.map(([dept, val])=>{
        const pct = Math.round(val.total/maxDeptTotal*100);
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span style="color:var(--txt)">${esc(dept)} <span style="color:var(--txt3)">(${val.count} trx)</span></span>
            <span style="font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px">${fmt(val.total)}</span>
          </div>
          <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%;background:var(--blue)"></div></div>
        </div>`;
      }).join('')}
    </div>

    <div class="section">
      <label>Top 5 Vendor (berdasarkan nominal)</label>
      ${topVendors.length===0 ? `<p style="font-size:12px;color:var(--txt3);text-align:center;padding:12px 0">Tidak ada data.</p>` :
      topVendors.map(([vendor, val], i)=>{
        const pct = Math.round(val.total/maxVendorTotal*100);
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span style="color:var(--txt)">${i+1}. ${esc(vendor)} <span style="color:var(--txt3)">(${val.count}x)</span></span>
            <span style="font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px">${fmt(val.total)}</span>
          </div>
          <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%;background:var(--orange)"></div></div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// ════════════════════════════════════════════════════════════
//  EXPORT EXCEL (download langsung dari browser via SheetJS)
// ════════════════════════════════════════════════════════════
function loadSheetJS() {
  return new Promise((resolve, reject) => {
    if (window.XLSX) { resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Gagal memuat library Excel'));
    document.head.appendChild(script);
  });
}

async function exportToExcel() {
  const monthVal = document.getElementById('dash-month')?.value;
  showLoader('Menyiapkan file Excel...');
  try {
    await loadSheetJS();

    const monthTrxs = monthVal ? trxs.filter(t => getMonthKey(t.createdAt) === monthVal) : trxs;

    const rows = monthTrxs.map(t => {
      const net = t.pajak?.nominalNet != null ? t.pajak.nominalNet : t.nominal;
      const colLabel = COLS.find(c=>c.id===t.status)?.label || t.status;
      return {
        'ID': t.id,
        'Nama Pengajuan': t.name,
        'Pengaju': t.pengaju,
        'Departemen': t.dept,
        'Tipe': t.tipe,
        'Vendor': t.vendor,
        'No. Invoice': t.invoice,
        'Tanggal': fmtD(t.createdAt),
        'Nominal Bruto': t.nominal,
        'Nominal Pajak': t.pajak?.nominalPajak || 0,
        'Net Diterima': net,
        'No. Rekening': t.noRekening || '',
        'Nama Bank': t.namaBank || '',
        'Nama Tujuan Rekening': t.namaTujuanRekening || '',
        'NPWP/NIK': t.npwpNik || '',
        'Bukti Potong': t.pajak?.buktiPotong || '',
        'Nomor Maker': t.makerId || '',
        'Nomor Bukti': t.buktNo || '',
        'Status': colLabel,
      };
    });

    if (rows.length === 0) {
      showToast('Tidak ada data untuk diexport pada periode ini', 'ti-alert-triangle');
      hideLoader();
      return;
    }

    const ws = XLSX.utils.json_to_sheet(rows);
    // Atur lebar kolom otomatis (perkiraan)
    const colWidths = Object.keys(rows[0]).map(key => {
      const maxLen = Math.max(key.length, ...rows.map(r => String(r[key]||'').length));
      return { wch: Math.min(maxLen + 2, 40) };
    });
    ws['!cols'] = colWidths;

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Transaksi');

    const filename = 'Laporan_Kanban_' + (monthVal || 'Semua') + '.xlsx';
    XLSX.writeFile(wb, filename);

    showToast('File Excel berhasil didownload', 'ti-file-spreadsheet');
  } catch(e) {
    showToast('Gagal export: ' + e.message, 'ti-alert-triangle');
  }
  hideLoader();
}
