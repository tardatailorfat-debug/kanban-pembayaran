<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Transaksi Pembayaran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --txt:#e6edf3;--txt2:#8b949e;--txt3:#484f58;
  --bdr:#30363d;--bdr2:#444c56;
  --blue:#388bfd;--blue-bg:#1f3a6e;
  --green:#3fb950;--green-bg:#1a3a25;
  --orange:#d29922;--orange-bg:#3d2f0b;
  --red:#f85149;--red-bg:#3d1a1a;
  --purple:#bc8cff;--purple-bg:#2d1f4e;
  --teal:#39d353;--teal-bg:#0d2e1a;
  --accent:#f0883e;
  --radius:8px;--radius-lg:12px;
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;font-size:13px;overflow:hidden}

/* LOGIN */
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:1000;background-image:radial-gradient(ellipse at 20% 50%,rgba(56,139,253,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(240,136,62,.05) 0%,transparent 40%)}
.login-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:16px;padding:40px;width:380px;box-shadow:var(--shadow)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.login-logo .ico{width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center}
.login-logo h1{font-size:17px;font-weight:700;letter-spacing:-.4px}
.login-logo p{font-size:11px;color:var(--txt2)}
.login-label{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.login-field{margin-bottom:16px}
.login-select,.login-input{width:100%;background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--radius);color:var(--txt);font-family:inherit;font-size:13px;padding:10px 12px;outline:none;transition:border-color .15s}
.login-select:focus,.login-input:focus{border-color:var(--blue)}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:inherit;font-size:14px;font-weight:600;padding:12px;cursor:pointer;transition:opacity .15s,transform .1s;margin-top:8px}
.login-btn:hover{opacity:.9}.login-btn:active{transform:scale(.98)}
.login-err{font-size:12px;color:var(--red);margin-top:8px;text-align:center;min-height:18px}

/* APP LAYOUT */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.topbar{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:0 16px;display:flex;align-items:center;gap:12px;height:50px;flex-shrink:0}
.topbar-logo{display:flex;align-items:center;gap:8px}
.topbar-logo .tl-ico{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center}
.topbar h1{font-size:14px;font-weight:600;letter-spacing:-.3px}
.role-badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--blue-bg);color:var(--blue);text-transform:uppercase;letter-spacing:.5px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb-btn{background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;color:var(--txt2);font-size:12px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;transition:border-color .15s,color .15s}
.tb-btn:hover{border-color:var(--bdr2);color:var(--txt)}

.stats-bar{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:0 16px;display:flex;gap:20px;align-items:center;height:36px;flex-shrink:0;overflow-x:auto}
.stats-bar::-webkit-scrollbar{height:0}
.stat-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt2);white-space:nowrap}
.stat-chip .dot{width:7px;height:7px;border-radius:50%}
.stat-chip strong{color:var(--txt);font-weight:600}

/* SEARCH BAR */
.search-bar{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.search-input-wrap{flex:1;min-width:180px;display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;padding:6px 10px}
.search-input-wrap input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-family:inherit;font-size:12.5px}
.search-input-wrap input::placeholder{color:var(--txt3)}
#search-clear{background:none;border:none;color:var(--txt3);cursor:pointer;padding:0;display:flex}
#search-clear:hover{color:var(--txt)}
.search-select{background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;color:var(--txt2);font-family:inherit;font-size:12px;padding:6px 8px;outline:none;flex-shrink:0}
.search-select:focus{border-color:var(--blue)}

/* BOARD */
.board-wrap{display:flex;flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding:12px;gap:10px}
.board-wrap::-webkit-scrollbar{height:5px}
.board-wrap::-webkit-scrollbar-track{background:var(--bg)}
.board-wrap::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.col{flex:0 0 230px;display:flex;flex-direction:column;background:var(--bg2);border-radius:10px;overflow:hidden;border:1px solid var(--bdr);min-height:0}
.col-hdr{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bdr);background:var(--bg3)}
.col-hdr .ico{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.col-hdr .label{font-size:11.5px;font-weight:600;flex:1;color:var(--txt)}
.col-hdr .cnt{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.cards{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
.cards::-webkit-scrollbar{width:3px}
.cards::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--radius);padding:10px;cursor:pointer;transition:border-color .15s,transform .1s,box-shadow .15s}
.card:hover{border-color:var(--bdr2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.card-id{font-size:10px;color:var(--txt3);font-family:'JetBrains Mono',monospace}
.card-name{font-size:12.5px;font-weight:600;color:var(--txt);margin:3px 0 2px}
.card-vendor{font-size:11px;color:var(--txt2);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.card-amount{font-size:13px;font-weight:600;color:var(--txt);font-family:'JetBrains Mono',monospace}
.card-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.card-dept{font-size:10px;color:var(--txt3)}
.card-rev-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--red-bg);color:var(--red);font-weight:600}
.add-btn{margin:8px;padding:8px;border:1px dashed var(--bdr2);border-radius:7px;background:none;color:var(--txt2);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;flex-shrink:0;font-family:inherit;transition:background .15s,color .15s,border-color .15s}
.add-btn:hover{background:var(--bg3);color:var(--txt);border-color:var(--blue)}

/* OVERLAY/MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.modal-hdr{padding:16px 18px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;gap:10px;position:sticky;top:0;background:var(--bg2);z-index:2}
.m-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-hdr h2{font-size:14px;font-weight:600;color:var(--txt)}
.modal-hdr p{font-size:11.5px;color:var(--txt2);margin-top:2px}
.modal-close{margin-left:auto;background:none;border:none;color:var(--txt3);cursor:pointer;padding:2px;font-size:18px;transition:color .15s}
.modal-close:hover{color:var(--txt)}
.modal-body{padding:16px 18px}
.section{margin-bottom:16px}
.section label,.slbl{display:block;font-size:10.5px;color:var(--txt3);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{font-size:13px;color:var(--txt);padding:8px 10px;background:var(--bg3);border-radius:var(--radius);border:1px solid var(--bdr);font-family:inherit}
input.fld,select.fld,textarea.fld{width:100%;outline:none;transition:border-color .15s}
input.fld:focus,select.fld:focus,textarea.fld:focus{border-color:var(--blue)}
textarea.fld{resize:vertical;min-height:60px}
select.fld option{background:var(--bg3)}
.info-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.info-grid .k{color:var(--txt2)}
.info-grid .v{color:var(--txt);font-weight:500;font-family:'JetBrains Mono',monospace;font-size:12px}
.info-grid .v.plain{font-family:inherit;font-size:13px}
.divider{height:1px;background:var(--bdr);margin:12px 0}
.tax-box{background:var(--bg3);border-radius:var(--radius);padding:12px;border:1px solid var(--bdr)}
.tax-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12.5px;color:var(--txt)}
.tax-row.total{font-weight:700;border-top:1px solid var(--bdr);margin-top:4px;padding-top:6px;color:var(--green)}
.hist-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.hist-text{font-size:12px;color:var(--txt)}
.hist-time{font-size:11px;color:var(--txt3);font-family:'JetBrains Mono',monospace}
.action-area{padding:12px 18px 16px;border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:8px}

/* BUTTONS */
.btn{padding:9px 16px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s,transform .1s;font-family:inherit}
.btn:hover{opacity:.85}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff}
.btn-success{background:var(--green);color:#0d1117}
.btn-danger{background:var(--red);color:#fff}
.btn-warn{background:var(--orange);color:#fff}
.btn-ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--bdr)}
.btn-teal{background:var(--teal);color:#0d1117}
.btn-purple{background:var(--purple);color:#0d1117}

/* FILE UPLOAD */
.upload-zone{border:1.5px dashed var(--bdr2);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--bg3)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--blue);background:rgba(56,139,253,.05)}
.upload-zone input{display:none}
.upload-zone .uz-ico{font-size:22px;color:var(--txt3);margin-bottom:6px}
.upload-zone p{font-size:12px;color:var(--txt2)}
.upload-zone small{font-size:10.5px;color:var(--txt3)}
.file-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.file-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--radius);padding:7px 10px}
.file-item .fi-name{flex:1;font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .fi-cat{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--blue-bg);color:var(--blue);font-weight:600}
.file-item a{color:var(--blue);font-size:11px;text-decoration:none;flex-shrink:0}
.file-item a:hover{text-decoration:underline}

/* REVISI BOX */
.revisi-box{background:var(--red-bg);border:1px solid rgba(248,81,73,.3);border-radius:var(--radius);padding:10px 12px}
.revisi-box .rv-lbl{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.revisi-box p{font-size:12.5px;color:var(--txt)}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg3);color:var(--txt);padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:300;display:flex;align-items:center;gap:8px;border:1px solid var(--bdr2);box-shadow:var(--shadow);animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* LOADER */
.loader{position:fixed;inset:0;background:rgba(13,17,23,.8);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:32px;height:32px;border:3px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{font-size:13px;color:var(--txt2)}

/* REPORT */
.report-stat{background:var(--bg3);border-radius:var(--radius);padding:12px}
.report-stat .rs-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.report-stat .rs-val{font-size:18px;font-weight:700;color:var(--txt)}
.prog-bar-wrap{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
.prog-bar{height:100%;border-radius:3px;transition:width .5s ease}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* ── RESPONSIVE MOBILE ─────────────────────────────── */
@media (max-width: 640px) {
  body{font-size:14px}

  /* Topbar mobile */
  .topbar{padding:0 10px;gap:6px;height:46px;flex-shrink:0}
  .topbar h1{font-size:11.5px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .topbar-actions{gap:4px;flex-shrink:0}
  .tb-btn{font-size:0;padding:6px 8px;gap:0;min-width:32px;min-height:32px;justify-content:center}
  .tb-btn i{font-size:15px!important}
  .role-badge{font-size:9px;padding:2px 5px;flex-shrink:0}
  #topbar-name{display:none}

  /* Stats bar */
  .stats-bar{gap:10px;padding:0 10px;height:30px;flex-shrink:0}
  .stat-chip{font-size:10px}
  .stat-chip span:not(strong){display:none}

  /* Search bar mobile */
  .search-bar{padding:6px 10px;gap:6px}
  .search-input-wrap{min-width:120px;padding:5px 8px}
  .search-input-wrap input{font-size:16px} /* cegah zoom iOS */
  .search-select{font-size:11px;padding:5px 6px}
  #filter-date-from, #filter-date-to{display:none} /* sembunyikan di mobile, terlalu sempit */

  /* Board: kolom scroll horizontal, tinggi mengisi sisa layar */
  .board-wrap{padding:8px;gap:8px;align-items:stretch}
  .col{flex:0 0 80vw;max-width:300px}
  .cards{flex:1;min-height:0;overflow-y:auto}

  /* Card */
  .card{padding:10px}
  .card-name{font-size:13px}
  .card-amount{font-size:13px}

  /* Modal mobile: slide dari bawah */
  .overlay{padding:0;align-items:flex-end}
  .modal{
    max-width:100%;
    width:100%;
    max-height:90dvh;
    border-radius:16px 16px 0 0;
    border-bottom:none;
  }
  .modal-hdr{padding:14px 16px 12px}
  .modal-body{padding:12px 16px}
  .action-area{padding:10px 16px env(safe-area-inset-bottom,16px)}

  /* Form: semua field jadi 1 kolom */
  .row2{grid-template-columns:1fr}
  .section{margin-bottom:12px}
  input.fld,select.fld,textarea.fld{font-size:16px!important} /* cegah zoom iOS */

  /* Buttons: touch-friendly */
  .btn{min-height:48px;font-size:14px;padding:12px 16px}
  .add-btn{min-height:44px;padding:10px}

  /* Tax form */
  .tax-box{padding:10px}
  .tax-row{font-size:13px}

  /* Login card */
  .login-card{width:calc(100% - 32px);max-width:400px;padding:24px 20px;border-radius:12px}

  /* Upload */
  .upload-zone{padding:14px}
  .upload-zone .uz-ico{font-size:20px;margin-bottom:4px}

  /* Info grid */
  .info-grid{font-size:12px}
  .info-grid .v{font-size:11.5px}

  /* History */
  .hist-text{font-size:12px}
  .hist-time{font-size:10.5px}

  /* Report */
  .report-stat .rs-val{font-size:15px}
}

@media (max-width: 380px) {
  .col{flex:0 0 88vw}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="ico"><i class="ti ti-building-bank" style="font-size:18px;color:#0d1117"></i></div>
      <div><h1>Kanban Pembayaran</h1><p>Sistem Transaksi Keuangan</p></div>
    </div>
    <div class="login-field">
      <div class="login-label">Role</div>
      <select class="login-select" id="ls-role">
        <option value="">— Pilih Role —</option>
        <option value="owner">Owner</option>
        <option value="finance">Finance</option>
        <option value="releaser">Releaser BOD</option>
        <option value="divisi_produksi">Divisi Produksi</option>
        <option value="sales">Sales</option>
        <option value="divisi_marketing">Divisi Marketing</option>
        <option value="umum">Umum</option>
      </select>
    </div>
    <div class="login-field">
      <div class="login-label">Nama Pengguna</div>
      <input type="text" class="login-input" id="ls-name" placeholder="Masukkan nama Anda">
    </div>
    <div class="login-field">
      <div class="login-label">Password</div>
      <input type="password" class="login-input" id="ls-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()"><i class="ti ti-login" style="margin-right:6px"></i>Masuk</button>
    <div class="login-err" id="ls-err"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-logo">
      <div class="tl-ico"><i class="ti ti-building-bank" style="font-size:14px;color:#0d1117"></i></div>
      <h1>Kanban Transaksi Pembayaran</h1>
    </div>
    <span class="role-badge" id="topbar-role"></span>
    <span style="font-size:12px;color:var(--txt2);margin-left:4px" id="topbar-name"></span>
    <div class="topbar-actions">
      <button class="tb-btn" onclick="loadAll()"><i class="ti ti-refresh" style="font-size:13px"></i> Refresh</button>
      <button class="tb-btn" id="btn-dashboard" onclick="showDashboard()" style="display:none"><i class="ti ti-layout-dashboard" style="font-size:13px"></i> Dashboard</button>
      <button class="tb-btn" id="btn-report" onclick="showReport()" style="display:none"><i class="ti ti-chart-bar" style="font-size:13px"></i> Laporan</button>
      <button class="tb-btn" id="btn-arsip" onclick="showArsip()" style="display:none"><i class="ti ti-archive" style="font-size:13px"></i> Arsip</button>
      <button class="tb-btn" id="btn-initdb" onclick="confirmInitDB()" style="display:none;border-color:var(--orange);color:var(--orange)"><i class="ti ti-database" style="font-size:13px"></i> Init DB</button>
      <button class="tb-btn" onclick="logout()"><i class="ti ti-logout" style="font-size:13px"></i> Keluar</button>
    </div>
  </div>
  <div class="search-bar" id="search-bar">
    <div class="search-input-wrap">
      <i class="ti ti-search" style="font-size:14px;color:var(--txt3)"></i>
      <input type="text" id="search-input" placeholder="Cari ID, nama, vendor, pengaju..." oninput="applyFilters()">
      <button id="search-clear" onclick="clearSearch()" style="display:none"><i class="ti ti-x" style="font-size:13px"></i></button>
    </div>
    <select id="filter-dept" class="search-select" onchange="applyFilters()">
      <option value="">Semua Dept</option>
    </select>
    <select id="filter-tipe" class="search-select" onchange="applyFilters()">
      <option value="">Semua Tipe</option>
    </select>
    <input type="date" id="filter-date-from" class="search-select" onchange="applyFilters()" title="Dari tanggal">
    <input type="date" id="filter-date-to" class="search-select" onchange="applyFilters()" title="Sampai tanggal">
    <button class="tb-btn" onclick="resetFilters()" style="flex-shrink:0"><i class="ti ti-filter-x" style="font-size:13px"></i></button>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="board-wrap" id="board"></div>
</div>

<!-- LOADER -->
<div class="loader" id="loader" style="display:none">
  <div class="spinner"></div>
  <p id="loader-msg">Memuat data...</p>
</div>

<!-- TOAST -->
<div class="toast" id="toast" style="display:none"></div>

<!-- MODAL CONTAINER -->

<script>
// ════════════════════════════════════════════════════════════
//  CONFIG — ganti URL di bawah ini
// ════════════════════════════════════════════════════════════
const API = 'https://script.google.com/macros/s/AKfycbxb0bUxkWGda81Y9Aq0L9oxjmX9nMr-x90Gxrf9eU40FBEZSaTnoQ9XuwcdPtqxz0ZbTA/exec';

const PASSWORDS = {
  owner:             'useradmin123',
  finance:           'superman999',
  releaser:          'bosziyad123',
  divisi_produksi:   'hahahihi',
  sales:             'pritha123',
  divisi_marketing:  'marketing1473',
  umum:              'tardaumum123',
};

const ROLE_LABELS = {
  owner:            'Owner',
  finance:          'Finance',
  releaser:         'Releaser BOD',
  divisi_produksi:  'Divisi Produksi',
  sales:            'Sales',
  divisi_marketing: 'Divisi Marketing',
  umum:             'Umum',
};

const COLS = [
  {id:'pengajuan',        label:'Pengajuan Dana',   icon:'ti-file-plus',      bg:'rgba(56,139,253,.15)',  fg:'#79c0ff', acc:'#388bfd'},
  {id:'verifikasi_berkas',label:'Verifikasi Berkas', icon:'ti-clipboard-check',bg:'rgba(188,140,255,.15)', fg:'#d2a8ff', acc:'#bc8cff'},
  {id:'verifikasi_pajak', label:'Verifikasi Pajak',  icon:'ti-receipt-tax',    bg:'rgba(210,153,34,.15)',  fg:'#e3b341', acc:'#d29922'},
  {id:'maker',            label:'Maker & Approver',  icon:'ti-user-check',     bg:'rgba(63,185,80,.15)',   fg:'#7ee787', acc:'#3fb950'},
  {id:'releaser',         label:'Releaser BOD',      icon:'ti-building-bank',  bg:'rgba(248,81,73,.15)',   fg:'#ffa198', acc:'#f85149'},
  {id:'bukti',            label:'Bukti Transaksi',   icon:'ti-circle-check',   bg:'rgba(57,211,83,.15)',   fg:'#39d353', acc:'#39d353'},
];

const PAJAK_TYPES = [
  {id:'pph21',label:'PPh 21',  rates:[{r:5,l:'5%'},{r:15,l:'15%'},{r:25,l:'25%'},{r:30,l:'30%'}]},
  {id:'pph22',label:'PPh 22',  rates:[{r:1.5,l:'1.5%'},{r:2,l:'2%'},{r:3,l:'3%'}]},
  {id:'pph23',label:'PPh 23',  rates:[{r:2,l:'2%'},{r:15,l:'15%'}]},
  {id:'pph4', label:'PPh 4(2)',rates:[{r:2,l:'2%'},{r:2.5,l:'2.5%'},{r:10,l:'10%'},{r:20,l:'20%'}]},
  {id:'ppn',  label:'PPN',     rates:[{r:11,l:'11%'}]},
];

const DEPTS = ['Keuangan','Operasional','HRD','IT','Procurement','Umum','Direksi','Produksi','Sales','Marketing'];
const TIPES = ['Pembelian Barang','Pembelian BBM','Pembayaran Tagihan','Biaya Operasional','Honor/Jasa','Sewa','Lainnya'];

let currentUser = null;
let trxs = [];
let toastTimer = null;

// ─── Session persistence ─────────────────────────────────────
function saveSession(user) {
  try { sessionStorage.setItem('kp_user', JSON.stringify(user)); } catch(e) {}
}
function loadSession() {
  try { return JSON.parse(sessionStorage.getItem('kp_user')||'null'); } catch(e) { return null; }
}
function clearSession() {
  try { sessionStorage.removeItem('kp_user'); } catch(e) {}
}

// Auto-restore session on page load
window.addEventListener('DOMContentLoaded', () => {
  const saved = loadSession();
  if (saved && saved.role && saved.name && PASSWORDS[saved.role]) {
    currentUser = saved;
    enterApp(saved);
  }
});

// ─── Helpers ────────────────────────────────────────────────
const fmt  = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n);
const fmtD = d => {
  if (!d) return '-';
  try {
    const dt = new Date(d);
    if (isNaN(dt)) return String(d);
    return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'});
  } catch(e) { return String(d); }
};
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function can(action) {
  const r = currentUser?.role;
  if (r === 'owner') return true;
  if (action === 'pengajuan') return ['divisi_produksi','sales','divisi_marketing','umum','finance'].includes(r);
  if (action === 'finance')   return r === 'finance';
  if (action === 'releaser')  return r === 'releaser';
  if (action === 'report')    return r === 'finance';
  return false;
}

function isAdmin() {
  const r = currentUser?.role;
  return ['divisi_produksi','sales','divisi_marketing','umum'].includes(r);
}

function isOwner() {
  return currentUser?.role === 'owner';
}

// ─── Login ──────────────────────────────────────────────────
function enterApp(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('topbar-role').textContent = ROLE_LABELS[user.role];
  document.getElementById('topbar-name').textContent = '– ' + user.name;
  // reset button visibility first
  ['btn-report','btn-arsip','btn-initdb','btn-dashboard'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  if (can('report') || isOwner()) document.getElementById('btn-report').style.display = 'flex';
  if (can('report') || isOwner()) document.getElementById('btn-arsip').style.display = 'flex';
  if (isOwner()) document.getElementById('btn-initdb').style.display = 'flex';
  if (can('report') || isOwner()) document.getElementById('btn-dashboard').style.display = 'flex';
  populateFilterOptions();
  loadAll();
}

function doLogin() {
  const role  = document.getElementById('ls-role').value;
  const name  = document.getElementById('ls-name').value.trim();
  const pass  = document.getElementById('ls-pass').value;
  const errEl = document.getElementById('ls-err');
  errEl.textContent = '';
  if (!role) { errEl.textContent = 'Pilih role terlebih dahulu.'; return; }
  if (!name) { errEl.textContent = 'Masukkan nama Anda.'; return; }
  if (pass !== PASSWORDS[role]) { errEl.textContent = 'Password salah.'; return; }
  currentUser = {role, name};
  saveSession(currentUser);
  enterApp(currentUser);
}

function logout() {
  // Tampilkan konfirmasi dulu
  document.getElementById('modal-area').innerHTML = `
  <div class="overlay">
    <div class="modal" style="max-width:340px">
      <div class="modal-hdr">
        <div class="m-icon" style="background:var(--red-bg)"><i class="ti ti-logout" style="font-size:16px;color:var(--red)"></i></div>
        <div><h2>Keluar</h2><p>Konfirmasi logout</p></div>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--txt2)">Apakah kamu yakin ingin keluar dari aplikasi?</p>
      </div>
      <div class="action-area">
        <button class="btn btn-danger" onclick="doLogout()"><i class="ti ti-logout" style="font-size:14px"></i> Ya, Keluar</button>
        <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      </div>
    </div>
  </div>`;
}

function doLogout() {
  currentUser = null; trxs = [];
  clearSession();
  closeModal();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('ls-pass').value = '';
  document.getElementById('ls-err').textContent = '';
}

// ─── API ────────────────────────────────────────────────────
async function apiGet(params) {
  const qs  = new URLSearchParams(params).toString();
  const res = await fetch(API + '?' + qs, {method:'GET', redirect:'follow'});
  const txt = await res.text();
  try { return JSON.parse(txt); } catch(e) { throw new Error('Response bukan JSON: ' + txt.slice(0,200)); }
}

async function apiPost(body) {
  const res = await fetch(API, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)});
  const txt = await res.text();
  try { return JSON.parse(txt); } catch(e) { throw new Error('Response bukan JSON: ' + txt.slice(0,200)); }
}

function showLoader(msg='Memuat...') { document.getElementById('loader-msg').textContent=msg; document.getElementById('loader').style.display='flex'; }
function hideLoader() { document.getElementById('loader').style.display='none'; }

// ─── Load All ────────────────────────────────────────────────
async function loadAll() {
  showLoader('Memuat data transaksi...');
  renderBoard(); renderStats();
  try {
    const res = await apiGet({action:'getTrxs'});
    if (res.ok) trxs = res.data || [];
    else showToast('API error: '+(res.error||'?'),'ti-alert-triangle');
  } catch(e) {
    showToast('Gagal konek ke database','ti-alert-triangle');
  }
  renderBoard(); renderStats();
  hideLoader();
}

// ─── Search & Filter ─────────────────────────────────────────
let activeFilters = { search:'', dept:'', tipe:'', dateFrom:'', dateTo:'' };

function getFilteredTrxs() {
  let result = trxs;
  const { search, dept, tipe, dateFrom, dateTo } = activeFilters;

  if (search) {
    const q = search.toLowerCase();
    result = result.filter(t =>
      (t.id||'').toLowerCase().includes(q) ||
      (t.name||'').toLowerCase().includes(q) ||
      (t.vendor||'').toLowerCase().includes(q) ||
      (t.pengaju||'').toLowerCase().includes(q) ||
      (t.invoice||'').toLowerCase().includes(q)
    );
  }
  if (dept) result = result.filter(t => t.dept === dept);
  if (tipe) result = result.filter(t => t.tipe === tipe);
  if (dateFrom) {
    const from = new Date(dateFrom + 'T00:00:00');
    result = result.filter(t => t.createdAt && new Date(t.createdAt) >= from);
  }
  if (dateTo) {
    const to = new Date(dateTo + 'T23:59:59');
    result = result.filter(t => t.createdAt && new Date(t.createdAt) <= to);
  }
  return result;
}

function applyFilters() {
  activeFilters.search   = document.getElementById('search-input')?.value.trim() || '';
  activeFilters.dept     = document.getElementById('filter-dept')?.value || '';
  activeFilters.tipe     = document.getElementById('filter-tipe')?.value || '';
  activeFilters.dateFrom = document.getElementById('filter-date-from')?.value || '';
  activeFilters.dateTo   = document.getElementById('filter-date-to')?.value || '';

  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.style.display = activeFilters.search ? 'flex' : 'none';

  renderBoard();
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  applyFilters();
}

function resetFilters() {
  document.getElementById('search-input').value = '';
  document.getElementById('filter-dept').value = '';
  document.getElementById('filter-tipe').value = '';
  document.getElementById('filter-date-from').value = '';
  document.getElementById('filter-date-to').value = '';
  applyFilters();
}

function populateFilterOptions() {
  const deptSel = document.getElementById('filter-dept');
  const tipeSel = document.getElementById('filter-tipe');
  if (!deptSel || !tipeSel) return;
  const curDept = deptSel.value, curTipe = tipeSel.value;
  deptSel.innerHTML = '<option value="">Semua Dept</option>' + DEPTS.map(d=>`<option value="${d}">${d}</option>`).join('');
  tipeSel.innerHTML = '<option value="">Semua Tipe</option>' + TIPES.map(t=>`<option value="${t}">${t}</option>`).join('');
  deptSel.value = curDept; tipeSel.value = curTipe;
}

// ─── Render Board ────────────────────────────────────────────
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const filtered = getFilteredTrxs();
  COLS.forEach(col => {
    const cards = filtered.filter(t => t.status === col.id);
    const canAdd = col.id === 'pengajuan' && (can('pengajuan') || isOwner());
    const colEl = document.createElement('div');
    colEl.className = 'col';
    colEl.innerHTML = `
      <div class="col-hdr">
        <div class="ico" style="background:${col.bg}"><i class="ti ${col.icon}" style="font-size:13px;color:${col.fg}"></i></div>
        <span class="label">${col.label}</span>
        <span class="cnt" style="background:${col.bg};color:${col.fg}">${cards.length}</span>
      </div>
      <div class="cards" id="cards-${col.id}">
        ${cards.length===0 ? `<div style="text-align:center;padding:20px 8px;font-size:11.5px;color:var(--txt3)">Tidak ada transaksi</div>` : cards.map(t => renderCardHTML(t, col)).join('')}
      </div>
      ${canAdd ? `<button class="add-btn" onclick="openAddModal()"><i class="ti ti-plus" style="font-size:12px"></i> Tambah Pengajuan</button>` : ''}
    `;
    board.appendChild(colEl);
    cards.forEach(t => {
      const el = document.getElementById('card-'+t.id);
      if (el) el.onclick = () => openTrxModal(t.id);
    });
  });
}

function renderCardHTML(t, col) {
  const hasRevisi = t.catatanRevisi && t.status === 'pengajuan';
  const net = t.pajak?.nominalNet != null ? t.pajak.nominalNet : t.nominal;
  return `
    <div class="card" id="card-${t.id}">
      <div class="card-id">${t.id}</div>
      <div class="card-name">${esc(t.name)}</div>
      <div class="card-vendor"><i class="ti ti-building" style="font-size:10px"></i>${esc(t.vendor)}</div>
      <div class="card-amount">${fmt(net)}</div>
      <div class="card-meta">
        <span class="tag" style="background:${col.bg};color:${col.fg}">${esc((t.tipe||'').split(' ')[0])}</span>
        <span class="card-dept">${esc(t.dept)}</span>
        ${t.pajak ? `<i class="ti ti-receipt-tax" style="font-size:11px;color:${col.acc};margin-left:auto"></i>` : ''}
        ${hasRevisi ? `<span class="card-rev-badge">REVISI</span>` : ''}
      </div>
    </div>`;
}

function renderStats() {
  const bar = document.getElementById('stats-bar');
  const totalSelesai = trxs.filter(t=>t.status==='bukti').length;
  const totalPajak   = trxs.reduce((s,t)=>s+(t.pajak?.nominalPajak||0),0);
  bar.innerHTML = COLS.map(c => {
    const cnt = trxs.filter(t=>t.status===c.id).length;
    return `<div class="stat-chip"><div class="dot" style="background:${c.acc}"></div><span>${c.label.split(' ').slice(0,2).join(' ')}</span><strong>${cnt}</strong></div>`;
  }).join('') +
  `<div style="margin-left:auto;display:flex;gap:20px">
    <div class="stat-chip"><i class="ti ti-circle-check" style="color:var(--green);font-size:13px"></i><span>Selesai</span><strong>${totalSelesai}</strong></div>
    <div class="stat-chip"><i class="ti ti-receipt" style="color:var(--orange);font-size:13px"></i><span>Total Pajak</span><strong>${fmt(totalPajak)}</strong></div>
  </div>`;
}

// ─── Render History ──────────────────────────────────────────
// Support dua format:
//   1. Array of { msg, ts, col, label } (dari backend baru)
//   2. String teks per baris: "[04 Jun 2026 22:28 WIB] Pesan" (fallback)
function parseHistoryFrontend(raw) {
  if (!raw) return [];
  // Sudah jadi array (dari backend)
  if (Array.isArray(raw)) return raw;
  // String teks per baris
  const lines = String(raw).split('\n').filter(Boolean);
  return lines.map(line => {
    const m = line.match(/^\[(.+?)\] (.+)$/);
    return { msg: m ? m[2] : line, label: m ? m[1] : '', col: 'pengajuan' };
  });
}

function renderHistory(raw) {
  const entries = parseHistoryFrontend(raw);
  if (entries.length === 0) return '<div style="font-size:12px;color:var(--txt3)">Belum ada riwayat.</div>';
  return [...entries].reverse().map(h => {
    const hcol = COLS.find(c => c.id === h.col) || COLS[0];
    const timeStr = h.label || (h.ts ? fmtD(h.ts) : '');
    return `<div class="hist-item">
      <div class="hist-dot" style="background:${hcol.acc}"></div>
      <div>
        <div class="hist-text">${esc(h.msg)}</div>
        ${timeStr ? `<div class="hist-time">${esc(timeStr)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ─── Toast ───────────────────────────────────────────────────
function showToast(msg, icon='ti-check') {
  const el = document.getElementById('toast');
  el.innerHTML = `<i class="ti ${icon}" style="font-size:15px;color:var(--green)"></i> ${msg}`;
  el.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.style.display='none', 3000);
}

// ─── UPDATE TRX ──────────────────────────────────────────────
async function updateTrx(id, patch, histMsg) {
  showLoader('Menyimpan...');
  try {
    const res = await apiPost({action:'updateTrx', id, patch, histMsg});
    if (res.ok) {
      const idx = trxs.findIndex(t=>t.id===id);
      if (idx !== -1) {
        trxs[idx] = {...trxs[idx], ...patch};
        if (!trxs[idx].history) trxs[idx].history = [];
        trxs[idx].history.push({msg:histMsg, ts:new Date().toISOString(), col:patch.status||trxs[idx].status});
      }
      renderBoard(); renderStats();
    } else { showToast('Gagal menyimpan: '+(res.error||'?'),'ti-alert-triangle'); }
  } catch(e) { showToast('Error koneksi','ti-alert-triangle'); }
  hideLoader();
}

// ════════════════════════════════════════════════════════════
//  MODAL — TAMBAH PENGAJUAN
// ════════════════════════════════════════════════════════════
// Format input nominal dengan titik ribuan otomatis
function formatNominalInput(el) {
  const pos   = el.selectionStart;
  const prev  = el.value.length;
  const raw   = el.value.replace(/\D/g, '');
  const formatted = raw ? Number(raw).toLocaleString('id-ID') : '';
  el.value = formatted;
  // Pertahankan posisi kursor
  const diff = formatted.length - prev;
  el.setSelectionRange(pos + diff, pos + diff);
}

function onBankChange(key) {
  const sel = document.getElementById('f-bank');
  const manual = document.getElementById('f-bank-manual');
  if (!sel || !manual) return;
  manual.style.display = sel.value === '__lain__' ? 'block' : 'none';
  if (sel.value === '__lain__') manual.focus();
}

function getBankValue() {
  const sel = document.getElementById('f-bank');
  if (!sel) return '';
  if (sel.value === '__lain__') {
    return (document.getElementById('f-bank-manual')?.value||'').trim();
  }
  return sel.value;
}

// ─── Generate Nomor Invoice Otomatis ────────────────────────
function getInvoicePrefix(role) {
  if (role === 'divisi_produksi')  return 'MP';
  if (role === 'divisi_marketing') return 'MM';
  if (role === 'sales')            return 'MO';
  return 'MU';
}

function generateInvoiceNo() {
  const role   = currentUser?.role || '';
  const prefix = getInvoicePrefix(role);

  // Format tanggal hari ini: DDMMYYYY
  const now = new Date();
  const dd  = String(now.getDate()).padStart(2,'0');
  const mm  = String(now.getMonth()+1).padStart(2,'0');
  const yyyy = now.getFullYear();
  const tgl  = dd + mm + yyyy;

  // Hitung berapa invoice dengan prefix+tanggal yang sama sudah ada di trxs (data lokal)
  const pattern = prefix + '-' + tgl + '-';
  const existing = trxs.filter(t => t.invoice && t.invoice.startsWith(pattern));
  const urut = String(existing.length + 1).padStart(3, '0');

  return prefix + '-' + tgl + '-' + urut;
}

function openAddModal() {
  const nextId    = 'TRX' + String(trxs.length + 1).padStart(3,'0');
  const invoiceNo = generateInvoiceNo();
  showFormModal({
    title: 'Tambah Pengajuan Baru',
    subtitle: 'ID: ' + nextId,
    icon: 'ti-file-plus',
    iconBg: 'rgba(56,139,253,.15)',
    iconFg: '#79c0ff',
    defaultName: '',
    defaultPengaju: currentUser.name,
    defaultInvoice: invoiceNo,
    invoiceReadonly: true,
    submitLabel: 'Ajukan Permintaan Dana',
    submitFn: 'submitAdd',
    fileKey: 'add',
  });
}

function openEditModal(id) {
  const t = trxs.find(x=>x.id===id);
  if (!t) return;
  closeModal();
  showFormModal({
    title: 'Edit Pengajuan',
    subtitle: t.id,
    icon: 'ti-edit',
    iconBg: 'rgba(210,153,34,.15)',
    iconFg: '#e3b341',
    defaultName: t.name,
    defaultPengaju: t.pengaju,
    defaultDept: t.dept,
    defaultTipe: t.tipe,
    defaultTanggal: t.createdAt ? t.createdAt.slice(0,10) : '',
    defaultVendor: t.vendor,
    defaultInvoice: t.invoice,
    defaultRek: t.noRekening,
    defaultBank: t.namaBank,
    defaultNamaTujuan: t.namaTujuanRekening,
    defaultNpwp: t.npwpNik,
    defaultNominal: t.nominal,
    defaultDesk: t.deskripsi,
    submitLabel: 'Simpan Perubahan',
    submitFn: 'submitEdit',
    fileKey: 'edit',
    editId: id,
  });
}

function showFormModal(cfg) {
  const d = cfg;
  const deptOpts = DEPTS.map(x=>`<option${x===d.defaultDept?' selected':''}>${x}</option>`).join('');
  const tipeOpts = TIPES.map(x=>`<option${x===d.defaultTipe?' selected':''}>${x}</option>`).join('');
  const html = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-hdr">
        <div class="m-icon" style="background:${d.iconBg}"><i class="ti ${d.icon}" style="font-size:16px;color:${d.iconFg}"></i></div>
        <div><h2>${d.title}</h2><p>${d.subtitle}</p></div>
        <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="modal-body">
        <div class="section"><label>Nama Pengajuan</label><input type="text" class="fld" id="f-name" value="${esc(d.defaultName||'')}" placeholder="Contoh: Pembelian ATK Q3..."></div>
        <div class="row2 section">
          <div><label>Nama Pengaju</label><input type="text" class="fld" id="f-pengaju" value="${esc(d.defaultPengaju||'')}"></div>
          <div><label>Departemen</label><select class="fld" id="f-dept">${deptOpts}</select></div>
        </div>

async function submitAdd() {
  const name          = document.getElementById('f-name')?.value.trim();
  const pengaju       = document.getElementById('f-pengaju')?.value.trim();
  const vendor        = document.getElementById('f-vendor')?.value.trim();
  const nominal       = String(document.getElementById('f-nominal')?.value||'').replace(/\D/g,'');
  const noRekening    = document.getElementById('f-rek')?.value.trim();
  const namaTujuan    = document.getElementById('f-namatujuan')?.value.trim();
  if (!name||!pengaju||!vendor||!nominal) { showToast('Lengkapi field wajib','ti-alert-triangle'); return; }
  if (!noRekening||!namaTujuan) { showToast('No. Rekening dan Nama Tujuan wajib diisi','ti-alert-triangle'); return; }
  const data = {
    name, pengaju,
    dept:document.getElementById('f-dept').value,
    tipe:document.getElementById('f-tipe').value,
    tanggal:document.getElementById('f-tanggal').value,
    vendor,
    nominal:Number(nominal),
    deskripsi:document.getElementById('f-desk').value,
    noRekening,
    namaBank:getBankValue(),
    npwpNik:document.getElementById('f-npwp').value,
    namaTujuanRekening: namaTujuan,
  };
  showLoader('Menyimpan pengajuan...');
  try {
    const res = await apiPost({action:'addTrx', data});
    if (res.ok) {
      const newId  = res.id;
      const invNo  = res.invoice || '';
      const files  = window._pendingFiles?.add || [];
      for (const f of files) await uploadFileToDrive(newId, f.file, 'lampiran_pengajuan');
      showToast(newId + ' berhasil dibuat | ' + invNo, 'ti-file-plus');
      closeModal();
      await loadAll();
    } else { showToast('Gagal: '+(res.error||'?'),'ti-alert-triangle'); }
  } catch(e) { showToast('Error: '+e,'ti-alert-triangle'); }
  hideLoader();
}

    dept:document.getElementById('f-dept').value,

    invoice:document.getElementById('f-invoice').value,

    deskripsi:document.getElementById('f-desk').value,

// Lazy load files — dipanggil hanya saat user klik "Lihat File"
async function loadFilesModal(trxId) {
  const container = document.getElementById('files-container-'+trxId);
  if (!container) return;
  container.innerHTML = '<span style="color:var(--txt3);font-size:12px">Memuat file...</span>';
  try {
    const res = await apiGet({action:'getFiles', trxId});
    const files = res.ok ? res.data : [];
    const lampiran  = files.filter(f=>f.category==='lampiran_pengajuan');
    const buktiBayar= files.filter(f=>f.category==='bukti_bayar');
    if (files.length===0) { container.innerHTML='<span style="color:var(--txt3);font-size:12px">Belum ada file.</span>'; return; }
    container.innerHTML = [
      lampiran.length>0 ? `<div style="font-size:10px;color:var(--txt3);font-weight:700;text-transform:uppercase;margin-bottom:4px">Lampiran</div>`+
        lampiran.map(f=>`<div class="file-item"><i class="ti ti-paperclip" style="font-size:13px;color:var(--txt3)"></i><span class="fi-name">${esc(f.fileName)}</span><span class="fi-cat">Lampiran</span><a href="${f.driveUrl}" target="_blank"><i class="ti ti-external-link" style="font-size:12px"></i> Buka</a></div>`).join('') : '',
      buktiBayar.length>0 ? `<div style="font-size:10px;color:var(--txt3);font-weight:700;text-transform:uppercase;margin:8px 0 4px">Bukti Bayar</div>`+
        buktiBayar.map(f=>`<div class="file-item"><i class="ti ti-receipt" style="font-size:13px;color:var(--green)"></i><span class="fi-name">${esc(f.fileName)}</span><span class="fi-cat" style="background:var(--green-bg);color:var(--green)">Bukti</span><a href="${f.driveUrl}" target="_blank"><i class="ti ti-external-link" style="font-size:12px"></i> Buka</a></div>`).join('') : '',
    ].join('');
  } catch(e) {
    container.innerHTML='<span style="color:var(--red);font-size:12px">Gagal memuat file.</span>';
  }
}

// ─── Action HTML per status ──────────────────────────────────
function buildActionHTML(t) {
  const owner = isOwner();

  // PENGAJUAN — Admin + Owner: edit & kirim. Finance + Owner: kirim saja
  if (t.status === 'pengajuan') {
    const adminAct   = isAdmin() || owner;
    const financeAct = can('finance');
    if (!adminAct && !financeAct) return '';
    let html = `<div class="action-area">`;
    if (adminAct) {
      html += `
        <button class="btn btn-warn" onclick="openEditModal('${t.id}')">
          <i class="ti ti-edit" style="font-size:14px"></i> Edit Berkas Pengajuan
        </button>`;
    }
    html += `
        <button class="btn btn-primary" onclick="doAction('${t.id}',{status:'verifikasi_berkas',catatanRevisi:''},'Berkas dikirim ke Verifikasi Berkas oleh ${esc(currentUser.name)}')">
          <i class="ti ti-send" style="font-size:14px"></i> Kirim ke Verifikasi Berkas
        </button>
      </div>`;
    return html;
  }

  // VERIFIKASI BERKAS — Finance + Owner
  if (t.status === 'verifikasi_berkas') {
    if (!can('finance') && !owner) return '';
    return `<div class="action-area">
      <button class="btn btn-success" onclick="doAction('${t.id}',{status:'verifikasi_pajak'},'Berkas dinyatakan lengkap dan valid')">
        <i class="ti ti-circle-check" style="font-size:14px"></i> Berkas Lengkap
      </button>
      <div>
        <label style="font-size:10.5px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block">Catatan Revisi (jika dikembalikan)</label>
        <textarea class="fld" id="catatan-revisi" placeholder="Tulis catatan untuk pengaju..." style="min-height:50px;width:100%"></textarea>
      </div>
      <button class="btn btn-danger" onclick="doRevisi('${t.id}')">
        <i class="ti ti-arrow-back" style="font-size:14px"></i> Kembalikan untuk Revisi
      </button>
    </div>`;
  }

  // VERIFIKASI PAJAK — Finance + Owner
  if (t.status === 'verifikasi_pajak') {
    if (!can('finance') && !owner) return '';
    return `<div class="action-area" id="pajak-action">
      <div style="display:flex;gap:8px">
        <button class="btn btn-success" style="flex:1" onclick="setPajakChoice(false,'${t.id}')">
          <i class="ti ti-x" style="font-size:14px"></i> Tidak Ada Pajak
        </button>
        <button class="btn btn-warn" style="flex:1" onclick="setPajakChoice(true,'${t.id}')">
          <i class="ti ti-receipt-tax" style="font-size:14px"></i> Ada Pajak
        </button>
      </div>
    </div>`;
  }

  // MAKER — Finance + Owner
  if (t.status === 'maker') {
    if (!can('finance') && !owner) return '';
    return `<div class="action-area">
      <button class="btn btn-success" onclick="doMaker('${t.id}')">
        <i class="ti ti-user-check" style="font-size:14px"></i> Buat & Approve Maker Transaksi
      </button>
    </div>`;
  }

  // RELEASER — Releaser BOD + Owner
  if (t.status === 'releaser') {
    if (!can('releaser') && !owner) return '';
    return `<div class="action-area">
      <button class="btn btn-teal" onclick="doReleaser('${t.id}')">
        <i class="ti ti-player-play" style="font-size:14px"></i> Tandai Sudah Dieksekusi BOD
      </button>
    </div>`;
  }

  // BUKTI — Finance + Owner upload; semua bisa lihat
  if (t.status === 'bukti') {
    let html = `<div class="action-area">
      <div style="padding:10px 12px;background:var(--green-bg);border-radius:var(--radius);border:1px solid rgba(63,185,80,.3)">
        <div style="display:flex;align-items:center;gap:8px">
          <i class="ti ti-circle-check" style="font-size:16px;color:var(--green)"></i>
          <span style="font-size:13px;font-weight:600;color:var(--green)">${esc(t.buktNo||'Selesai')}</span>
        </div>
      </div>`;
    if (can('finance') || owner) {
      html += `
      <div>
        <label style="font-size:10.5px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block">Upload Bukti Pembayaran</label>
        <div class="upload-zone" id="uz-bukti" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event,'bukti')" onclick="document.getElementById('fi-bukti').click()">
          <div class="uz-ico"><i class="ti ti-receipt-2"></i></div>
          <p>Klik untuk upload bukti transfer</p>
          <small>PDF, JPG, PNG, max 10MB</small>
          <input type="file" id="fi-bukti" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="handleFileSelect(this,'bukti')">
        </div>
        <div class="file-list" id="fl-bukti"></div>
        <button class="btn btn-purple" style="margin-top:8px;width:100%" onclick="uploadBuktiBayar('${t.id}')">
          <i class="ti ti-upload" style="font-size:14px"></i> Simpan Bukti Pembayaran
        </button>
      </div>`;
    }
    html += `</div>`;
    return html;
  }
  return '';
}

// ─── Pajak UI ────────────────────────────────────────────────
let _pajakState = {type:'pph23', rate:2, grossUp:false, mode:'auto'};

function setPajakChoice(ada, trxId) {
  const area = document.getElementById('pajak-action');
  if (!ada) {
    area.innerHTML = `<button class="btn btn-success" onclick="doAction('${trxId}',{status:'maker',pajak:null},'Bebas pajak, lanjut ke Maker')">
      <i class="ti ti-arrow-right" style="font-size:14px"></i> Lanjut ke Maker (Bebas Pajak)
    </button>`;
    return;
  }
  _pajakState = {type:'pph23', rate:2, grossUp:false, mode:'auto'};
  renderPajakForm(trxId);
}

function renderPajakForm(trxId) {
  const t = trxs.find(x=>x.id===trxId);
  const base = t?.nominal || 0;
  const area = document.getElementById('pajak-action');
  const isAuto = _pajakState.mode === 'auto';

  // Hitung nilai otomatis
  const selPajak = PAJAK_TYPES.find(p=>p.id===_pajakState.type) || PAJAK_TYPES[0];
  let autoNominalPajak=0, autoNominalNet=0, autoNominalGross=0;
  if (_pajakState.grossUp) {
    autoNominalGross = Math.round(base/(1-_pajakState.rate/100));
    autoNominalPajak = autoNominalGross-base; autoNominalNet = base;
  } else {
    autoNominalPajak = Math.round(base*(_pajakState.rate/100));
    autoNominalNet = base-autoNominalPajak; autoNominalGross = base;
  }

  area.innerHTML = `
    <!-- Toggle Auto/Manual -->
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <button onclick="_pajakState.mode='auto';renderPajakForm('${trxId}')" style="flex:1;padding:8px;border-radius:6px;border:1.5px solid ${isAuto?'var(--orange)':'var(--bdr)'};background:${isAuto?'var(--orange-bg)':'var(--bg3)'};color:${isAuto?'var(--orange)':'var(--txt2)'};font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">

async function submitPajakAuto(trxId, base, nominalPajak, nominalNet, nominalGross) {
  const bp = (document.getElementById('pj-buktipotong')?.value||'').trim();
  if (!bp) { showToast('Isi Nomor Bukti Potong terlebih dahulu','ti-alert-triangle'); return; }
  const selPajak = PAJAK_TYPES.find(p=>p.id===_pajakState.type);
  const pajakData = {
    type:_pajakState.type, typeLabel:selPajak.label,
    rate:_pajakState.rate, grossUp:_pajakState.grossUp,
    nominalPajak, nominalNet, buktiPotong:bp, manual:false
  };
  if (_pajakState.grossUp) {
    // FIX 5: gross up → kembalikan ke Pengajuan Dana agar vendor upload invoice revisi
    await updateTrx(trxId, {status:'pengajuan', pajak:pajakData, catatanRevisi:'Bukti potong '+bp+' telah diterbitkan. Mohon upload invoice revisi sesuai nominal gross up.'},
      'Bukti potong '+bp+' terbit. Menunggu invoice revisi dari vendor (dikembalikan ke Pengajuan)');
  } else {
    await updateTrx(trxId, {status:'maker', pajak:pajakData},
      'Pajak '+selPajak.label+' '+_pajakState.rate+'% = '+fmt(nominalPajak)+'. Net: '+fmt(nominalNet)+'. Bukti: '+bp);
  }
  closeModal();
}

async function submitPajakManual(trxId) {
  const bp     = (document.getElementById('pj-buktipotong')?.value||'').trim();
  const inv    = Number(String(document.getElementById('pm-invoice')?.value||'').replace(/\D/g,''));
  const pajak  = Number(String(document.getElementById('pm-pajak')?.value||'').replace(/\D/g,''));
  const net    = Number(String(document.getElementById('pm-net')?.value||'').replace(/\D/g,''));
  const gross  = Number(String(document.getElementById('pm-gross')?.value||'').replace(/\D/g,''));
  const jenis  = (document.getElementById('pm-jenis')?.value||'').trim();
  if (!bp)    { showToast('Isi Nomor Bukti Potong','ti-alert-triangle'); return; }
  if (!inv)   { showToast('Isi Nominal Invoice','ti-alert-triangle'); return; }
  if (!pajak) { showToast('Isi Nominal Pajak','ti-alert-triangle'); return; }
  if (!net)   { showToast('Isi Nominal Net Diterima','ti-alert-triangle'); return; }
  const pajakData = {
    manual: true, typeLabel: jenis||'Manual', rate: null,
    grossUp: gross > 0, nominalGross: gross||null,
    nominalPajak: pajak, nominalNet: net, buktiPotong: bp
  };
  await updateTrx(trxId, {status:'maker', pajak:pajakData},
    'Pajak manual: '+fmt(pajak)+'. Net: '+fmt(net)+'. Bukti: '+bp);
  closeModal();
}

// ─── File Upload ─────────────────────────────────────────────
function handleFileSelect(input, key) {
  if (!window._pendingFiles) window._pendingFiles = {};
  if (!window._pendingFiles[key]) window._pendingFiles[key] = [];
  Array.from(input.files).forEach(f=>window._pendingFiles[key].push({file:f,name:f.name}));
  renderPendingFiles(key);
}
function handleDrop(e, key) {
  e.preventDefault();
  document.getElementById('uz-'+key)?.classList.remove('drag');
  if (!window._pendingFiles) window._pendingFiles = {};
  if (!window._pendingFiles[key]) window._pendingFiles[key] = [];
  Array.from(e.dataTransfer.files).forEach(f=>window._pendingFiles[key].push({file:f,name:f.name}));
  renderPendingFiles(key);
}
function renderPendingFiles(key) {
  const container = document.getElementById('fl-'+key);
  if (!container) return;
  const files = window._pendingFiles?.[key] || [];
  container.innerHTML = files.map((f,i)=>`
    <div class="file-item">
      <i class="ti ti-file" style="font-size:13px;color:var(--txt3)"></i>
      <span class="fi-name">${esc(f.name)}</span>
      <button onclick="removePendingFile('${key}',${i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;flex-shrink:0"><i class="ti ti-x"></i></button>
    </div>`).join('');
}
function removePendingFile(key,idx) {
  if (window._pendingFiles?.[key]) { window._pendingFiles[key].splice(idx,1); renderPendingFiles(key); }
}
async function uploadFileToDrive(trxId, file, category) {
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = async e=>{
      const base64 = e.target.result.split(',')[1];
      try {
        const res = await apiPost({action:'uploadFile',trxId,category,fileName:file.name,mimeType:file.type||'application/octet-stream',base64,uploadedBy:currentUser.name});
        resolve(res);
      } catch(err){ resolve({ok:false}); }
    };
    reader.readAsDataURL(file);
  });
}
async function uploadBuktiBayar(trxId) {
  const files = window._pendingFiles?.bukti||[];
  if (files.length===0){ showToast('Pilih file terlebih dahulu','ti-alert-triangle'); return; }
  showLoader('Mengupload bukti pembayaran...');
  for (const f of files) await uploadFileToDrive(trxId, f.file, 'bukti_bayar');
  showToast('Bukti pembayaran berhasil diupload','ti-receipt');
  hideLoader();
  closeModal();
  await openTrxModal(trxId);
}

// Hitung lead time (jam) dari Pengajuan → Selesai, berdasarkan history
function calcLeadTimeHours(t) {
  if (!t.history || t.history.length === 0) return null;
  const sorted = [...t.history].filter(h=>h.ts).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  if (sorted.length === 0) return null;
  const start = new Date(sorted[0].ts);
  const endEntry = sorted.find(h => /dieksekusi BOD|bukti.*diterbitkan/i.test(h.msg));
  if (!endEntry) return null;
  const end = new Date(endEntry.ts);
  const diffMs = end - start;
  if (diffMs < 0) return null;
  return diffMs / (1000*60*60);
}

function getMonthKey(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function renderDashboardContent() {
  const monthVal = document.getElementById('dash-month')?.value;
  if (!monthVal) return;

  // Filter trxs by bulan (berdasarkan createdAt)
  const monthTrxs = trxs.filter(t => getMonthKey(t.createdAt) === monthVal);

  const total    = monthTrxs.length;
  const totBruto = monthTrxs.reduce((s,t)=>s+(t.nominal||0),0);
  const selesai  = monthTrxs.filter(t=>t.status==='bukti').length;

  // Breakdown per divisi/departemen
  const byDept = {};
  monthTrxs.forEach(t => {
    const d = t.dept || 'Lainnya';
    if (!byDept[d]) byDept[d] = { count:0, total:0 };
    byDept[d].count++;
    byDept[d].total += (t.nominal||0);
  });
  const deptRows = Object.entries(byDept).sort((a,b)=>b[1].total-a[1].total);

  // Top 5 vendor
  const byVendor = {};
  monthTrxs.forEach(t => {
    const v = t.vendor || 'Lainnya';
    if (!byVendor[v]) byVendor[v] = { count:0, total:0 };
    byVendor[v].count++;
    byVendor[v].total += (t.nominal||0);
  });
  const topVendors = Object.entries(byVendor).sort((a,b)=>b[1].total-a[1].total).slice(0,5);

  // Lead time rata-rata (hanya transaksi yang sudah selesai & punya data lengkap)
  const leadTimes = monthTrxs.filter(t=>t.status==='bukti').map(calcLeadTimeHours).filter(v=>v!=null);
  const avgLeadTimeHours = leadTimes.length>0 ? leadTimes.reduce((a,b)=>a+b,0)/leadTimes.length : null;
  const avgLeadTimeLabel = avgLeadTimeHours!=null
    ? (avgLeadTimeHours < 24 ? avgLeadTimeHours.toFixed(1)+' jam' : (avgLeadTimeHours/24).toFixed(1)+' hari')
    : '-';

  const maxDeptTotal = deptRows.length>0 ? deptRows[0][1].total : 1;
  const maxVendorTotal = topVendors.length>0 ? topVendors[0][1].total : 1;

  const container = document.getElementById('dashboard-content');
  if (!container) return;
  container.innerHTML = `
    <div class="row2 section" style="gap:10px;margin-top:14px">
      <div class="report-stat"><div class="rs-lbl" style="color:var(--blue)">Total Transaksi</div><div class="rs-val">${total}</div></div>
      <div class="report-stat"><div class="rs-lbl" style="color:var(--green)">Selesai</div><div class="rs-val">${selesai}</div></div>
      <div class="report-stat"><div class="rs-lbl" style="color:var(--orange)">Total Nominal</div><div class="rs-val" style="font-size:13px">${fmt(totBruto)}</div></div>
      <div class="report-stat"><div class="rs-lbl" style="color:var(--purple)">Rata2 Lead Time</div><div class="rs-val" style="font-size:13px">${avgLeadTimeLabel}</div></div>
    </div>

    <div class="section">
      <label>Breakdown per Departemen</label>
      ${deptRows.length===0 ? `<p style="font-size:12px;color:var(--txt3);text-align:center;padding:12px 0">Tidak ada data di bulan ini.</p>` :
      deptRows.map(([dept, val])=>{
        const pct = Math.round(val.total/maxDeptTotal*100);
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span style="color:var(--txt)">${esc(dept)} <span style="color:var(--txt3)">(${val.count} trx)</span></span>
            <span style="font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px">${fmt(val.total)}</span>
          </div>
          <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%;background:var(--blue)"></div></div>
        </div>`;
      }).join('')}
    </div>

    <div class="section">
      <label>Top 5 Vendor (berdasarkan nominal)</label>
      ${topVendors.length===0 ? `<p style="font-size:12px;color:var(--txt3);text-align:center;padding:12px 0">Tidak ada data.</p>` :
      topVendors.map(([vendor, val], i)=>{
        const pct = Math.round(val.total/maxVendorTotal*100);
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span style="color:var(--txt)">${i+1}. ${esc(vendor)} <span style="color:var(--txt3)">(${val.count}x)</span></span>
            <span style="font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px">${fmt(val.total)}</span>
          </div>
          <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%;background:var(--orange)"></div></div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// ════════════════════════════════════════════════════════════
//  EXPORT EXCEL (download langsung dari browser via SheetJS)
// ════════════════════════════════════════════════════════════
function loadSheetJS() {
  return new Promise((resolve, reject) => {
    if (window.XLSX) { resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Gagal memuat library Excel'));
    document.head.appendChild(script);
  });
}

async function exportToExcel() {
  const monthVal = document.getElementById('dash-month')?.value;
  showLoader('Menyiapkan file Excel...');
  try {
    await loadSheetJS();

    const monthTrxs = monthVal ? trxs.filter(t => getMonthKey(t.createdAt) === monthVal) : trxs;

    const rows = monthTrxs.map(t => {
      const net = t.pajak?.nominalNet != null ? t.pajak.nominalNet : t.nominal;
      const colLabel = COLS.find(c=>c.id===t.status)?.label || t.status;
      return {
        'ID': t.id,
        'Nama Pengajuan': t.name,
        'Pengaju': t.pengaju,
        'Departemen': t.dept,
        'Tipe': t.tipe,
        'Vendor': t.vendor,
        'No. Invoice': t.invoice,
        'Tanggal': fmtD(t.createdAt),
        'Nominal Bruto': t.nominal,
        'Nominal Pajak': t.pajak?.nominalPajak || 0,
        'Net Diterima': net,
        'No. Rekening': t.noRekening || '',
        'Nama Bank': t.namaBank || '',
        'Nama Tujuan Rekening': t.namaTujuanRekening || '',
        'NPWP/NIK': t.npwpNik || '',
        'Bukti Potong': t.pajak?.buktiPotong || '',
        'Nomor Maker': t.makerId || '',
        'Nomor Bukti': t.buktNo || '',
        'Status': colLabel,
      };
    });

    if (rows.length === 0) {
      showToast('Tidak ada data untuk diexport pada periode ini', 'ti-alert-triangle');
      hideLoader();
      return;
    }

    const ws = XLSX.utils.json_to_sheet(rows);
    // Atur lebar kolom otomatis (perkiraan)
    const colWidths = Object.keys(rows[0]).map(key => {
      const maxLen = Math.max(key.length, ...rows.map(r => String(r[key]||'').length));
      return { wch: Math.min(maxLen + 2, 40) };
    });
    ws['!cols'] = colWidths;

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Transaksi');

    const filename = 'Laporan_Kanban_' + (monthVal || 'Semua') + '.xlsx';
    XLSX.writeFile(wb, filename);

    showToast('File Excel berhasil didownload', 'ti-file-spreadsheet');
  } catch(e) {
    showToast('Gagal export: ' + e.message, 'ti-alert-triangle');
  }
  hideLoader();
}
</script>
